<!DOCTYPE html>
<html lang="en">
<head>

<title>The Mike Case</title>
<meta name="description" content="The Mike Case, build 2026-10-07a">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a0d13;--ink2:#5c1420;--panel:#4a1520;--panel2:#5c1c28;--paper:#f5ece0;--dim:#d9b6ab;--gold:#f2a71b;--line:rgba(245,236,224,.16);--lineS:rgba(245,236,224,.32);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:linear-gradient(150deg,var(--ink),var(--ink2) 60%,#42111a);color:var(--paper);font-family:Inter,sans-serif;line-height:1.55;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);min-height:100vh}
h1,h2,.serif{font-family:Fraunces,serif}
.top{position:sticky;top:0;z-index:10;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0));background:rgba(58,13,19,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{font-size:13px;color:var(--dim)}.brand b{color:var(--paper)}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--dim);background:none;border:1px solid transparent;padding:5px 8px;cursor:pointer}
.langs button.on{color:var(--paper);border-color:var(--lineS)}
main{display:flex;justify-content:center;padding:44px 20px 90px}
.stage{max-width:660px;width:100%}
h1{font-size:30px;margin:4px 0 22px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.narrative p{font-size:16.5px;color:#f0e2d6;max-width:60ch;margin:0 0 14px}
em{color:var(--paper);font-style:italic}
.div{height:1px;background:var(--line);margin:28px 0}
.choice{display:flex;gap:14px;border:1px solid var(--line);border-left:3px solid var(--lineS);background:rgba(0,0,0,.14);padding:16px 18px;margin-bottom:10px;width:100%;text-align:left;cursor:pointer;color:var(--paper);font-family:inherit}
.choice:hover{border-left-color:var(--gold);background:rgba(0,0,0,.26)}
.cl{font-family:Fraunces,serif;color:var(--gold);font-size:19px;min-width:20px}
.clabel{font-weight:600;margin-bottom:3px}
.ctext{font-size:14px;color:#e6cfc2}
.lang .choice{align-items:center;padding:20px}
.lang .clabel{font-family:Fraunces,serif;font-size:21px;margin:0}
.lang .arrow{margin-left:auto;color:var(--gold);font-size:20px}
.conseq{border:1px solid var(--lineS);background:rgba(0,0,0,.22);padding:24px}
.conseq h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 6px}
.conseq p{margin:0 0 16px;font-size:14.5px;color:#f0e2d6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font-size:12px;padding:5px 9px;border:1px solid var(--lineS);display:inline-flex;gap:6px;align-items:center;color:var(--paper)}
.chip.on{border-color:rgba(242,167,27,.6);background:rgba(242,167,27,.1)}
.chip.muted{color:var(--dim);font-style:italic}
.impLabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 8px}
.btn{background:var(--gold);color:#2a0a0e;border:none;padding:12px 24px;font-weight:700;cursor:pointer;margin-top:20px;font-size:14.5px;font-family:inherit}
.btn.sec{background:none;color:var(--paper);border:1px solid var(--lineS)}
input[type=text]{width:100%;max-width:340px;background:rgba(0,0,0,.2);border:1px solid var(--lineS);color:var(--paper);padding:11px 13px;margin-bottom:20px;font-size:16px}
.fw{border:1px solid var(--lineS);background:rgba(0,0,0,.15);padding:22px;margin:8px 0 28px}
.fw b{color:var(--paper)}
.fwGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
@media(max-width:700px){.fwGrid{grid-template-columns:1fr}}
.badge{display:inline-block;background:var(--gold);color:#2a0a0e;font-weight:700;font-size:10.5px;letter-spacing:.06em;padding:3px 9px;margin-bottom:10px;text-transform:uppercase}
.fwCol .tagline{font-size:9.5px;color:var(--dim);text-transform:none;letter-spacing:0;margin-left:6px}
.fwItem{font-size:13px;color:#e6cfc2;margin-bottom:10px;padding-left:10px;border-left:2px solid var(--line)}
.fwItem.mute{opacity:.7}
.fwItem b{display:block;color:var(--paper);font-size:12.5px;margin-bottom:2px}
.fwItem .ask{display:block;margin-top:4px;font-style:italic;color:var(--dim);font-size:11.5px}
.note{font-size:13px;color:var(--dim);border-left:2px solid var(--gold);padding-left:12px;max-width:58ch;margin:14px 0}
.bar{display:grid;grid-template-columns:170px 1fr 32px;gap:12px;align-items:center;margin-bottom:12px}
.bn{font-size:12px;color:var(--dim)}
.bt{height:6px;background:rgba(245,236,224,.15)}.bf{height:100%;background:var(--gold)}
.profile{font-family:Fraunces,serif;color:var(--gold);font-size:22px;margin:20px 0 10px}
.focus{border:1px solid var(--gold);background:rgba(242,167,27,.1);padding:18px 20px;margin:22px 0}
.focus b.name{display:block;font-family:Fraunces,serif;font-size:20px;margin:8px 0 6px}
.card{border:1px solid var(--lineS);padding:28px;background:rgba(0,0,0,.18)}
.sec{margin-bottom:20px}
.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
.sec ul{margin:0;padding-left:18px}
.sec li{font-size:14.5px;color:#f0e2d6;margin-bottom:6px}
.commit{font-style:italic;border-left:2px solid var(--gold);padding-left:12px;font-size:15px}
@media print{.top,.btn{display:none!important}body{background:#fff;color:#111}.card{border-color:#999;background:#fff}}
</style>
</head>

<script>
const GAME={"id":"peer","excelNames":["Live Your Passion for the Brand","Act Like It’s Your Own Company","Think Bigger and Beyond"],"d":[[{"inclusion":6,"engage":4,"develop":5,"results":3,"accountability":1,"grow":2},{"inclusion":3,"engage":2,"develop":1,"results":0,"accountability":-1,"grow":2},{"inclusion":-4,"engage":-2,"develop":-1,"results":-1,"accountability":-4,"grow":-1}],[{"inclusion":7,"engage":2,"develop":2,"results":2,"accountability":5,"grow":1},{"inclusion":4,"engage":3,"develop":3,"results":2,"accountability":3,"grow":3},{"inclusion":1,"engage":0,"develop":1,"results":1,"accountability":2,"grow":0}],[{"inclusion":-1,"engage":0,"develop":-2,"results":0,"accountability":-4,"grow":-1},{"inclusion":0,"engage":-3,"develop":-2,"results":0,"accountability":1,"grow":-1},{"inclusion":-1,"engage":1,"develop":-3,"results":-1,"accountability":-3,"grow":0}],[{"inclusion":-3,"engage":-1,"develop":-2,"results":0,"accountability":-2,"grow":-1},{"inclusion":-2,"engage":-1,"develop":-1,"results":0,"accountability":-1,"grow":-2},{"inclusion":-1,"engage":0,"develop":-2,"results":0,"accountability":1,"grow":-1}],[{"inclusion":3,"engage":2,"develop":2,"results":4,"accountability":6,"grow":2},{"inclusion":-2,"engage":-1,"develop":-1,"results":-2,"accountability":-4,"grow":0},{"inclusion":1,"engage":1,"develop":0,"results":1,"accountability":1,"grow":2}]],"t":{"en":{"ui":{"docTitle":"The Mike Case — What Do I Do As a Peer?","brand":"As a Peer","introTag":"A Simulation for Team Members","introTitle":"The Mike Case — What If You’re Not the One Leading?","introLead":"You’re not the manager. But you were in the room when Mike, a senior colleague, unintentionally made it harder for Alex to be heard. Psychological safety doesn’t only depend on who has a title — it also depends on what peers do, or don’t do.","fwNote":"Even without formal authority, your choices are scored against the same adidas Leadership Framework. Psychological safety affects team performance — so \u003cb>Deliver Results\u003c/b> factors in here too.","introFoot":"5 decisions — still faster than the leadership version. Most have no clearly perfect option.","resultNote":"Your profile comes from your performance across the six pillars below — psychological safety is something any colleague can strengthen or weaken, with or without a leadership title.","planTitle":"Your Action Plan as a Peer"},"excel":[{"w":"Connects everyday work to adidas’ purpose, products, consumers, and culture — in actions, not just words.","a":"Do I feel more connected to adidas because of how the people around me show up?"},{"w":"Takes real ownership of outcomes, balancing impact on people and the business.","a":"Do I take ownership for outcomes even when it’s uncomfortable, even without a title?"},{"w":"Looks ahead, challenges the way things are usually done, and makes room for better solutions.","a":"Am I helping the team look ahead, or only reacting to what’s in front of us?"}],"scored":{"inclusion":"Helps create an environment where different perspectives are genuinely valued and included.","engage":"Brings energy and clarity that helps the people around you do their best work.","develop":"Actively supports a colleague’s growth through honest, specific feedback.","results":"Helps turn good ideas into outcomes by making space for them to be heard.","accountability":"Names issues constructively instead of letting them slide, even without formal authority.","grow":"Stays open to feedback and curious about your own blind spots."},"phases":[{"title":"You Were In the Room","narrative":["You’re not the manager. But you were in the meeting when Mike laughed off Alex’s idea — \u003cem>“we actually tried that years ago, I guess every new hire has to rediscover our old mistakes”\u003c/em> — and you saw Alex go quiet for the rest of the meeting.","No one else seems to have noticed, or maybe they noticed and decided not to act. You don’t have a leadership title here — but it’s clear this landed on Alex.","You have a short window, still inside the meeting, to decide if you do anything."],"choices":[{"l":"Support Alex’s idea right there, without confronting Mike directly","t":"“Actually, I think there’s something here — Alex, can you say more about how this would’ve helped with last month’s issue?”","imm":"The conversation returns to Alex’s idea, without naming Mike’s comment. Alex seems a little more at ease continuing.","del":"Alex remembers that someone pulled the idea back to the table — but Mike’s comment itself was never named by anyone.","why":"This gives Alex space back without turning the meeting into a confrontation that isn’t yours to lead — a real way to act without formal authority. The cost is that the pattern itself stays unnamed, and stays easier to repeat."},{"l":"Stay quiet in the meeting, but check in with Alex privately afterward","t":"You say nothing in the moment. Later, you message Alex: “Saw what happened earlier. Your idea made sense to me.”","imm":"Alex replies with a brief but genuine-sounding “thanks.”","del":"Alex knows at least one person noticed. But no one in the room saw it happen, so the group’s norm doesn’t shift.","why":"A private show of support is real and low-risk — a solid first step if you don’t want to put Alex further in the spotlight. The cost is that it’s invisible to the rest of the team, who still don’t know that comment bothered anyone."},{"l":"Assume the manager will notice and handle it — not your role to fix","t":"You figure that stepping in isn’t your place; your manager is in the room and can notice on their own.","imm":"The meeting continues. No one else comments.","del":"Weeks later, you notice Alex barely speaks up in meetings anymore — and you can’t say whether anyone, including you, ever did anything about it.","why":"It’s true that publicly correcting a colleague isn’t the job of whoever doesn’t run the meeting — that hesitation is reasonable. But psychological safety doesn’t depend only on who has a title: waiting for someone else is also a choice, and it has a cost."}]},{"title":"Mike Interrupts Again","narrative":["Two weeks later, Mike cuts Alex off mid-explanation — again. His suggestion isn’t even wrong, but it’s the second time this month. Your manager is in the meeting and doesn’t react.","You’re Alex’s peer, not Mike’s manager. Still, what you do in the next few seconds shapes what the room learns is normal."],"choices":[{"l":"Step in, lightly, as a peer","t":"“Hold on, let Alex finish — I think there’s more there.”","imm":"Mike stops. “My bad,” he says. Alex finishes the point.","del":"Alex notices that someone other than the manager noticed and acted. Mike is slightly more careful around you too, afterward.","why":"A peer stepping in, not just the manager, sends a strong signal that this doesn’t depend only on who has a title. The risk is that it can look like you’re publicly correcting a senior colleague, which not everyone in the room may read well."},{"l":"Let it pass, but check with Alex about whether they want support raising it with the manager","t":"After the meeting: “I noticed Mike cut you off again. Want me to mention it to our manager with you, or would you rather handle it your own way?”","imm":"Alex is relieved someone noticed, but hesitates: “I don’t know if I want to make this a whole thing.”","del":"The decision correctly stays with Alex — but the pattern keeps happening while they decide.","why":"Asking Alex, instead of deciding for them, respects the autonomy of the person most affected — exactly the kind of support any peer can offer. The cost is that a solution may take longer while the pattern keeps repeating."},{"l":"Message the manager directly about it, without talking to Alex first","t":"After the meeting you write to the manager: “Noticed Mike cut Alex off again, thought you should know.”","imm":"The manager thanks you for the flag. Alex doesn’t know this conversation happened.","del":"If Alex finds out later, they may feel their situation became someone else’s topic without being consulted — even with good intent on your part.","why":"Flagging it to the manager is a legitimate move and can speed up a real correction. The cost is deciding this without including Alex, who arguably has the most say in how and when their own situation gets raised."}]},{"title":"Telling Mike Yourself","narrative":["You decide the pattern is clear enough that Mike should hear it directly from a peer, not just from a manager. You’re weighing tone and setting — something fair, respectful, and that actually gets through.","Every option you’re considering has a catch, even though none of them look outright wrong."],"choices":[{"l":"Post a general reminder in the team channel, without naming him","t":"“Friendly reminder: let’s all make sure we let people finish their thoughts before jumping in — goes for all of us :)” you post in the team channel.","imm":"A few people react with a thumbs up. Mike doesn’t respond at all.","del":"Because it was addressed to everyone, Mike can reasonably assume it wasn’t about him — and the specific pattern with Alex goes unaddressed.","why":"A public, general reminder avoids singling anyone out, which can feel like the fairer, lower-risk option. The cost is that vague, addressed-to-everyone feedback lets the one person it’s actually about opt out of hearing it — and it does nothing for Alex, who watched it happen and knows exactly who it was about."},{"l":"Tell him “a few people have noticed,” without saying who","t":"“Hey, a few people have noticed you cutting folks off in meetings — might be worth watching.”","imm":"Mike looks caught off guard. “Who said that?” he asks. You don’t answer.","del":"Mike spends the next few days wondering who’s talking about him behind his back, more focused on that than on the actual behavior.","why":"Citing “a few people” can feel like it adds weight, and protects any one person from being identified as the source. But invoking an anonymous collective makes the feedback feel like it’s coming from everywhere and nowhere — it’s hard for Mike to actually engage with, and can read as being ganged up on rather than given honest, ownable feedback."},{"l":"Bring it up casually at the team happy hour, so it feels lower-stakes","t":"At drinks after work, you mention it lightly: “Haha, you really shut Alex down earlier, huh?”","imm":"Mike laughs it off in the moment: “Yeah, yeah, my bad.” The conversation moves on immediately.","del":"Because it was framed as a joke in a social setting, Mike doesn’t register it as feedback at all — and nothing changes.","why":"A casual, social moment can feel like the least confrontational way to raise something, and sometimes lands better than a formal sit-down. The cost is that wrapping real feedback in a joke, in a space that’s implicitly off-duty, makes it easy for the other person not to take it seriously — and mixes a corrective conversation into a space that’s supposed to be free of exactly that."}]},{"title":"Trying to Help","narrative":["You finally decide to talk to Alex about all of this. Your intentions are good — but the three easiest ways to open this conversation share one problem, even though none of them looks wrong at first glance."],"choices":[{"l":"Minimize it, to reassure","t":"“Don’t worry about it, Mike’s like that with everyone, it’s not personal.”","imm":"Alex nods, but doesn’t seem more relieved — just ready to drop the subject.","del":"Alex learns that raising this again will likely be met with “it’s not a big deal” — which discourages them from bringing it up if it happens again.","why":"This feels comforting and tries to lighten the moment — a genuine intention. But minimizing invalidates Alex’s experience before you’ve even really heard it — deciding it’s “not personal” isn’t your call to make for them."},{"l":"Center a similar experience of your own","t":"“Oh, I know exactly how that feels, he does that to me too, this one time...” — and you keep going with your own story.","imm":"Alex listens politely, but barely gets to return to their own point.","del":"Alex leaves the conversation feeling like they came to vent and ended up hearing about someone else’s experience.","why":"Sharing a similar experience can genuinely build connection and show Alex they’re not alone. The problem is when it takes over the space — Alex’s psychological safety depends on being heard, not on you feeling understood."},{"l":"Offer to fix it for them, without asking first","t":"“Leave it with me, I’ll talk to Mike about this directly.”","imm":"Alex says “okay,” a little uncertain, without having asked for this.","del":"If the conversation with Mike doesn’t go well, Alex may end up in the middle of a tension they didn’t choose — and without being consulted on how they wanted their own situation handled.","why":"Offering to take concrete action comes from real care, and is sometimes exactly what someone wants. The problem is assuming that without asking — it takes away Alex’s choice over whether and how their situation gets addressed by someone else."}]},{"title":"When (and How) to Escalate","narrative":["The pattern with Mike continues, week after week. Alex still hasn’t formally raised it. You notice it’s also costing the team — good ideas aren’t reaching the table, and some technical calls are slower or worse without Alex’s input.","There’s more than one reasonable way to take this forward — and each comes with a different cost."],"choices":[{"l":"Raise it now, with what you’ve seen, even without Alex asking","t":"You set up time with your manager and describe the pattern you’ve observed, being clear it’s your own read, not Alex’s.","imm":"The manager thanks you and says they’ll pay closer attention.","del":"Something shifts faster — but Alex may feel surprised to learn their situation was raised without them choosing the timing.","why":"Acting on what you’ve seen, and being transparent that it’s your own read, is a legitimate way to keep a real pattern from waiting too long — and it connects directly to the quality of the team’s decisions. The cost is deciding the timing for Alex, even with good intent."},{"l":"Wait for an even clearer pattern before taking it anywhere","t":"You decide you’re still not certain enough, and prefer to keep watching a while longer.","imm":"Nothing changes in the short term.","del":"The pattern repeats once more, in a similar way, before anything is said.","why":"Wanting certainty before acting is a genuine form of care and avoids false alarms. The risk is that you’ve already seen this pattern repeat more than once — waiting for “even clearer” can become a way of postponing indefinitely."},{"l":"Use an indirect channel — an engagement survey or anonymous feedback tool","t":"You log what you observed in the company’s anonymous feedback channel, without naming specific people.","imm":"It gets recorded, without directly exposing anyone.","del":"It may take longer to turn into concrete action, and it’s unclear whether anyone will connect that entry to Alex’s situation.","why":"An indirect channel is a real tool when a direct conversation feels too risky, and it doesn’t require anyone to expose themselves. The cost is speed, and the chance the signal gets lost among other entries."}]}],"profiles":{"champion":{"name":"Consistent Psychological Safety Ally","sum":"Even without a leadership title, you acted consistently, respectfully, and specifically — protecting space for whoever had less power in the room, even when it wasn’t technically your job.","str":"Notices patterns early. Acts with care for the other person’s autonomy. Doesn’t wait passively for whoever has the title.","risk":"Watch out for taking on the role of “fixing it” for others — ask before acting on someone’s behalf."},"inconsistent":{"name":"Well-Meaning but Inconsistent Peer","sum":"You care, but your responses varied — sometimes real, careful support, other times avoidance or making the moment about you.","str":"Genuine care for colleagues.","risk":"Inconsistency can be confusing for someone who needs predictable, not occasional, support."},"avoider":{"name":"Cautious Bystander","sum":"You tend to wait for formal leadership to fix things, even when you sense something is wrong. That’s understandable — it’s not your title — but it has a real cost for whoever is affected.","str":"Respects hierarchy and avoids overstepping.","risk":"Silence can read as agreement, even without meaning to."},"silencer":{"name":"Unintended Reinforcer","sum":"Your choices — minimizing, centering yourself, acting without asking — likely made it harder, without meaning to, for Alex to feel truly heard. This is common among well-intentioned colleagues.","str":"Real desire to help.","risk":"Good intentions don’t guarantee the affected person feels supported."}},"plan":{"CONT":{"inclusion":"Handing the floor back to quieter colleagues when you notice space closing.","engage":"Bringing lightness and trust into tense moments between colleagues.","develop":"Offering specific, not just generic, support to whoever needs it.","results":"Noticing when a colleague’s silence may be costing the team quality.","accountability":"Naming patterns, even without a title, instead of waiting for whoever has one.","grow":"Asking before acting on someone else’s behalf."},"START":{"inclusion":"Actively inviting quieter colleagues back into the conversation.","engage":"Using tension as a chance for connection, not just discomfort to avoid.","develop":"Offering concrete support by asking what the person actually needs.","results":"Connecting your support to better technical calls for the team.","accountability":"Raising repeated patterns, even when it’s not formally your role.","grow":"Asking a trusted colleague whether your way of helping actually helps."},"COMMIT":{"inclusion":"In the next meeting, I will notice who went quiet and bring them back into the conversation.","engage":"Next time a colleague goes through something hard, I will ask how to support before acting.","develop":"This week, I will offer one piece of specific, not generic, support to a colleague.","results":"This week, I will notice whether any silence on the team may be costing us a better decision.","accountability":"This week, I will name one pattern I’ve been letting slide, even if it’s not formally my role.","grow":"This month, I will ask a colleague whether my way of supporting them actually helps."},"DISC":{"inclusion":"What concrete habit would help a quieter colleague feel invited to speak up?","engage":"How do you tell the difference between supporting someone and centering the conversation on yourself?","develop":"How could you practice asking “how can I help” before acting on someone’s behalf?","results":"What decision on your team could have been better if someone had felt safe to speak up earlier?","accountability":"What pattern between colleagues have you been letting slide because it’s not “formally your job”?","grow":"Who could you ask whether your way of supporting people is actually useful?"}}},"es":{"ui":{"docTitle":"The Mike Case: ¿qué hago como par?","brand":"Como par","introTag":"Una simulación para integrantes del equipo","introTitle":"The Mike Case: ¿y si no eres tú quien lidera?","introLead":"No eres quien lidera el equipo. Pero estabas en la sala cuando Mike, un colega senior, hizo sin querer que fuera más difícil que se escuchara a Alex. La seguridad psicológica no depende solo de quién tiene un cargo: también depende de lo que hacen, o no hacen, los pares.","fwNote":"Incluso sin autoridad formal, tus decisiones se evalúan según el mismo adidas Leadership Framework. La seguridad psicológica afecta el desempeño del equipo, así que \u003cb>Deliver Results\u003c/b> también cuenta aquí.","introFoot":"5 decisiones, más rápida que la versión de liderazgo. La mayoría no tiene una opción claramente perfecta.","resultNote":"Tu perfil surge de tu desempeño en los seis pilares de abajo: la seguridad psicológica es algo que cualquier colega puede fortalecer o debilitar, con o sin un cargo de liderazgo.","planTitle":"Tu plan de acción como par"},"excel":[{"w":"Conecta el trabajo cotidiano con el propósito, los productos, los consumidores y la cultura de adidas, en las acciones y no solo en las palabras.","a":"¿Siento más conexión con adidas por la forma en que se muestran las personas que me rodean?"},{"w":"Se hace cargo de verdad de los resultados, equilibrando el impacto en las personas y en el negocio.","a":"¿Me hago cargo de los resultados incluso cuando es incómodo, incluso sin un cargo?"},{"w":"Mira hacia adelante, cuestiona la forma habitual de hacer las cosas y abre espacio para mejores soluciones.","a":"¿Estoy ayudando al equipo a mirar hacia adelante, o solo reacciono a lo que tenemos enfrente?"}],"scored":{"inclusion":"Ayuda a crear un entorno donde las distintas perspectivas se valoran e incluyen de verdad.","engage":"Aporta una energía y una claridad que ayudan a quienes te rodean a hacer su mejor trabajo.","develop":"Apoya activamente el crecimiento de un colega con feedback honesto y específico.","results":"Ayuda a convertir buenas ideas en resultados al abrir espacio para que se escuchen.","accountability":"Nombra los problemas de forma constructiva en lugar de dejarlos pasar, incluso sin autoridad formal.","grow":"Mantiene la apertura al feedback y la curiosidad sobre sus propios puntos ciegos."},"phases":[{"title":"Estabas en la sala","narrative":["No eres quien lidera el equipo. Pero estabas en la reunión cuando Mike descartó entre risas la idea de Alex (\u003cem>“en realidad eso ya lo probamos hace años, supongo que cada persona nueva tiene que redescubrir nuestros viejos errores”\u003c/em>) y viste que Alex no volvió a hablar en el resto de la reunión.","Nadie más parece haberlo notado, o quizás lo notaron y decidieron no actuar. Aquí no tienes un cargo de liderazgo, pero está claro que a Alex le afectó.","Tienes una ventana corta, todavía dentro de la reunión, para decidir si haces algo."],"choices":[{"l":"Apoyar la idea de Alex ahí mismo, sin confrontar a Mike directamente","t":"“En realidad, creo que aquí hay algo. Alex, ¿puedes contar más sobre cómo esto habría ayudado con el problema del mes pasado?”","imm":"La conversación vuelve a la idea de Alex, sin nombrar el comentario de Mike. Alex parece continuar con un poco más de comodidad.","del":"Alex recuerda que alguien volvió a poner la idea sobre la mesa, pero el comentario de Mike nunca fue nombrado por nadie.","why":"Esto le devuelve espacio a Alex sin convertir la reunión en una confrontación que no te corresponde liderar: una forma real de actuar sin autoridad formal. El costo es que el patrón en sí queda sin nombrar, y por eso es más fácil que se repita."},{"l":"Quedarte en silencio en la reunión, pero hablar con Alex en privado después","t":"No dices nada en el momento. Más tarde, le escribes a Alex: “Vi lo que pasó hoy. Tu idea me pareció razonable.”","imm":"Alex responde con un “gracias” breve, pero que suena genuino.","del":"Alex sabe que al menos una persona lo notó. Pero nadie en la sala lo vio, así que la norma del grupo no cambia.","why":"Una muestra de apoyo en privado es real y de bajo riesgo: un buen primer paso si no quieres exponer más a Alex. El costo es que resulta invisible para el resto del equipo, que sigue sin saber que ese comentario le molestó a alguien."},{"l":"Asumir que tu manager lo va a notar y lo va a manejar: no es tu rol resolverlo","t":"Piensas que intervenir no te corresponde; tu manager está en la sala y puede notarlo sin ayuda.","imm":"La reunión continúa. Nadie más comenta.","del":"Semanas después, notas que Alex casi no habla en las reuniones, y no puedes decir si alguien, empezando por ti, hizo algo al respecto.","why":"Es cierto que corregir públicamente a un colega no es tarea de quien no conduce la reunión: esa duda es razonable. Pero la seguridad psicológica no depende solo de quién tiene un cargo: esperar a que actúe otra persona también es una decisión, y tiene un costo."}]},{"title":"Mike interrumpe otra vez","narrative":["Dos semanas después, Mike interrumpe a Alex en plena explicación, otra vez. Su sugerencia ni siquiera es incorrecta, pero es la segunda vez este mes. Tu manager está en la reunión y no reacciona.","Eres par de Alex, no manager de Mike. Aun así, lo que hagas en los próximos segundos define qué aprende la sala que es normal."],"choices":[{"l":"Intervenir, con suavidad, como par","t":"“Espera, deja que Alex termine. Creo que hay más ahí.”","imm":"Mike se detiene. “Culpa mía”, dice. Alex termina su punto.","del":"Alex nota que alguien más, aparte de tu manager, se dio cuenta y actuó. Después, Mike también es un poco más cuidadoso contigo.","why":"Que intervenga un par, y no solo quien lidera, envía una señal fuerte de que esto no depende solo de quién tiene un cargo. El riesgo es que puede parecer que estás corrigiendo en público a un colega senior, algo que no todos en la sala van a leer bien."},{"l":"Dejarlo pasar, pero preguntarle a Alex si quiere apoyo para plantearlo con tu manager","t":"Después de la reunión: “Noté que Mike te interrumpió otra vez. ¿Quieres que se lo mencione a nuestro manager contigo, o prefieres manejarlo a tu manera?”","imm":"A Alex le alivia que alguien lo haya notado, pero duda: “No sé si quiero hacer de esto un tema.”","del":"La decisión queda, correctamente, en manos de Alex, pero el patrón sigue ocurriendo mientras decide.","why":"Preguntarle a Alex, en lugar de decidir en su nombre, respeta la autonomía de la persona más afectada: justo el tipo de apoyo que cualquier par puede ofrecer. El costo es que la solución puede tardar más mientras el patrón se sigue repitiendo."},{"l":"Escribirle directamente a tu manager, sin hablar antes con Alex","t":"Después de la reunión le escribes a tu manager: “Noté que Mike interrumpió a Alex otra vez, me pareció que debías saberlo.”","imm":"Tu manager te agradece el aviso. Alex no sabe que esta conversación ocurrió.","del":"Si Alex se entera más adelante, puede sentir que su situación se convirtió en tema de otra persona sin que le consultaran, aun con buena intención de tu parte.","why":"Avisarle a tu manager es una jugada legítima y puede acelerar una corrección real. El costo es decidirlo sin incluir a Alex, que probablemente es quien más tiene que decir sobre cómo y cuándo se plantea su propia situación."}]},{"title":"Decírselo tú a Mike","narrative":["Decides que el patrón es lo bastante claro como para que Mike lo escuche directamente de un par, y no solo de quien lidera. Estás evaluando el tono y el contexto: algo justo, respetuoso y que realmente llegue.","Cada opción que estás considerando tiene una trampa, aunque ninguna se vea claramente mal."],"choices":[{"l":"Publicar un recordatorio general en el canal del equipo, sin nombrarlo","t":"“Recordatorio amistoso: asegurémonos de dejar que las personas terminen sus ideas antes de intervenir. Va para todos :)”, publicas en el canal del equipo.","imm":"Algunas personas reaccionan con un pulgar arriba. Mike no responde nada.","del":"Como estaba dirigido a todos, Mike puede asumir razonablemente que no era por él, y el patrón específico con Alex queda sin abordar.","why":"Un recordatorio público y general evita señalar a alguien, lo que puede parecer la opción más justa y de menor riesgo. El costo es que un feedback vago y dirigido a todos le permite a la única persona a la que realmente apunta no darse por aludida, y no hace nada por Alex, que lo vio ocurrir y sabe exactamente de quién se trataba."},{"l":"Decirle que “varias personas lo notaron”, sin decir quiénes","t":"“Oye, varias personas notaron que interrumpes a la gente en las reuniones. Quizás valga la pena prestarle atención.”","imm":"A Mike lo toma desprevenido. “¿Quién dijo eso?”, pregunta. No respondes.","del":"Mike pasa los días siguientes preguntándose quién habla de él a sus espaldas, más enfocado en eso que en la conducta en sí.","why":"Citar a “varias personas” puede parecer que le da más peso y protege a cualquiera de ser identificado como la fuente. Pero invocar a un colectivo anónimo hace que el feedback parezca venir de todas partes y de ninguna: a Mike le cuesta trabajarlo de verdad, y puede leerse como un ataque en grupo y no como un feedback honesto del que alguien se hace cargo."},{"l":"Mencionarlo de manera casual en el after office del equipo, para que se sienta menos serio","t":"En unos tragos después del trabajo, lo mencionas a la ligera: “Jaja, hoy sí que callaste a Alex, ¿eh?”","imm":"Mike se ríe en el momento: “Sí, sí, culpa mía.” La conversación cambia de tema enseguida.","del":"Como se planteó como un chiste en un contexto social, Mike no lo registra como feedback en absoluto, y nada cambia.","why":"Un momento casual y social puede parecer la forma menos confrontativa de plantear algo, y a veces cae mejor que una conversación formal. El costo es que envolver un feedback real en un chiste, en un espacio que implícitamente está fuera del trabajo, hace fácil que la otra persona no lo tome en serio, y mezcla una conversación correctiva en un espacio que se supone libre de eso."}]},{"title":"Intentar ayudar","narrative":["Finalmente decides hablar con Alex sobre todo esto. Tus intenciones son buenas, pero las tres formas más fáciles de abrir esta conversación comparten un problema, aunque ninguna parezca mala a primera vista."],"choices":[{"l":"Minimizarlo, para tranquilizar","t":"“No te preocupes, Mike es así con todo el mundo, no es personal.”","imm":"Alex asiente, pero no parece sentir más alivio: solo ganas de dejar el tema.","del":"Alex aprende que volver a plantearlo probablemente reciba un “no es para tanto”, lo que desalienta que lo mencione si vuelve a pasar.","why":"Esto se siente reconfortante y busca alivianar el momento: una intención genuina. Pero minimizar invalida la experiencia de Alex antes de que la hayas escuchado de verdad: decidir que “no es personal” no es algo que te corresponda decidir en su lugar."},{"l":"Poner en el centro una experiencia parecida tuya","t":"“Uy, sé exactamente cómo se siente, a mí también me lo hace, una vez...”, y sigues con tu propia historia.","imm":"Alex escucha con cortesía, pero casi no llega a volver a su propio tema.","del":"Alex se va de la conversación con la sensación de que vino a desahogarse y terminó escuchando la experiencia de otra persona.","why":"Compartir una experiencia parecida puede generar conexión genuina y mostrarle a Alex que no es la única persona a la que le pasa. El problema es cuando ocupa todo el espacio: la seguridad psicológica de Alex depende de que se le escuche, no de que tú sientas comprensión."},{"l":"Ofrecerte a resolverlo en su lugar, sin preguntar antes","t":"“Déjamelo a mí, voy a hablar con Mike de esto directamente.”","imm":"Alex dice “bueno”, con algo de duda, sin haberlo pedido.","del":"Si la conversación con Mike no sale bien, Alex puede quedar en medio de una tensión que no eligió, y sin que le consultaran cómo quería que se manejara su propia situación.","why":"Ofrecerte a tomar una acción concreta nace de un interés real, y a veces es exactamente lo que alguien quiere. El problema es asumirlo sin preguntar: le quita a Alex la decisión sobre si su situación la aborda otra persona, y cómo."}]},{"title":"Cuándo (y cómo) escalar","narrative":["El patrón con Mike continúa, semana tras semana. Alex todavía no lo planteó formalmente. Notas que también le está costando al equipo: las buenas ideas no llegan a la mesa, y algunas decisiones técnicas son más lentas o peores sin el aporte de Alex.","Hay más de una forma razonable de llevar esto adelante, y cada una tiene un costo distinto."],"choices":[{"l":"Plantearlo ahora, con lo que viste, aunque Alex no lo haya pedido","t":"Agendas un espacio con tu manager y describes el patrón que observaste, dejando claro que es tu propia lectura, no la de Alex.","imm":"Tu manager te agradece y dice que va a prestar más atención.","del":"Algo cambia más rápido, pero a Alex puede sorprenderle saber que su situación se planteó sin haber elegido el momento.","why":"Actuar a partir de lo que viste, con transparencia sobre que es tu propia lectura, es una forma legítima de evitar que un patrón real espere demasiado, y se conecta directamente con la calidad de las decisiones del equipo. El costo es decidir el momento por Alex, aun con buena intención."},{"l":"Esperar un patrón todavía más claro antes de llevarlo a algún lado","t":"Decides que todavía no tienes suficiente certeza y prefieres seguir observando un tiempo más.","imm":"Nada cambia en el corto plazo.","del":"El patrón se repite una vez más, de forma parecida, antes de que alguien diga algo.","why":"Querer certeza antes de actuar es una forma genuina de cuidado y evita falsas alarmas. El riesgo es que ya viste repetirse este patrón más de una vez: esperar a que sea “todavía más claro” puede convertirse en una forma de postergar indefinidamente."},{"l":"Usar un canal indirecto: una encuesta de engagement o una herramienta de feedback anónimo","t":"Registras lo que observaste en el canal de feedback anónimo de la empresa, sin nombrar a personas específicas.","imm":"Queda registrado, sin exponer directamente a nadie.","del":"Puede tardar más en convertirse en una acción concreta, y no está claro que alguien vaya a relacionar ese registro con la situación de Alex.","why":"Un canal indirecto es una herramienta real cuando una conversación directa resulta demasiado riesgosa, y no exige que nadie se exponga. El costo es la velocidad, y la posibilidad de que la señal se pierda entre otros registros."}]}],"profiles":{"champion":{"name":"Apoyo consistente a la seguridad psicológica","sum":"Incluso sin un cargo de liderazgo, actuaste de forma consistente, respetuosa y específica, protegiendo el espacio de quien tenía menos poder en la sala, aunque técnicamente no fuera tu trabajo.","str":"Nota los patrones a tiempo. Actúa cuidando la autonomía de la otra persona. No espera pasivamente a quien tiene el cargo.","risk":"Cuidado con asumir el rol de “resolverlo” por los demás: pregunta antes de actuar en nombre de alguien."},"inconsistent":{"name":"Buenas intenciones, apoyo inconsistente","sum":"Te importa, pero tus respuestas variaron: a veces un apoyo real y cuidadoso, otras veces evasión o hacer que el momento girara en torno a ti.","str":"Interés genuino por tus colegas.","risk":"La inconsistencia puede confundir a alguien que necesita un apoyo predecible, no ocasional."},"avoider":{"name":"Observación cautelosa","sum":"Tiendes a esperar que el liderazgo formal resuelva las cosas, incluso cuando percibes que algo anda mal. Es comprensible, no es tu cargo, pero tiene un costo real para la persona afectada.","str":"Respeta la jerarquía y evita extralimitarse.","risk":"El silencio puede leerse como acuerdo, aun sin quererlo."},"silencer":{"name":"Refuerzo involuntario","sum":"Tus decisiones (minimizar, ponerte en el centro, actuar sin preguntar) probablemente hicieron más difícil, sin quererlo, que Alex sintiera una escucha real. Es común entre colegas con buenas intenciones.","str":"Deseo real de ayudar.","risk":"Las buenas intenciones no garantizan que la persona afectada sienta apoyo."}},"plan":{"CONT":{"inclusion":"Devolverles la palabra a colegas que hablan menos cuando notas que el espacio se cierra.","engage":"Llevar ligereza y confianza a los momentos tensos entre colegas.","develop":"Ofrecer un apoyo específico, y no solo genérico, a quien lo necesita.","results":"Notar cuándo el silencio de un colega puede estar costándole calidad al equipo.","accountability":"Nombrar los patrones, incluso sin un cargo, en lugar de esperar a quien lo tiene.","grow":"Preguntar antes de actuar en nombre de otra persona."},"START":{"inclusion":"Invitar activamente a colegas que hablan menos a volver a la conversación.","engage":"Usar la tensión como una oportunidad de conexión, y no solo como una incomodidad a evitar.","develop":"Ofrecer apoyo concreto preguntando qué necesita realmente la persona.","results":"Conectar tu apoyo con mejores decisiones técnicas para el equipo.","accountability":"Plantear los patrones repetidos, incluso cuando formalmente no es tu rol.","grow":"Preguntarle a un colega de confianza si tu forma de ayudar realmente ayuda."},"COMMIT":{"inclusion":"En la próxima reunión, voy a notar quién dejó de hablar y voy a traer a esa persona de vuelta a la conversación.","engage":"La próxima vez que un colega pase por algo difícil, voy a preguntar cómo apoyar antes de actuar.","develop":"Esta semana, voy a ofrecerle a un colega un apoyo específico, no genérico.","results":"Esta semana, voy a notar si algún silencio en el equipo puede estar costándonos una mejor decisión.","accountability":"Esta semana, voy a nombrar un patrón que vengo dejando pasar, aunque formalmente no sea mi rol.","grow":"Este mes, voy a preguntarle a un colega si mi forma de apoyar realmente le sirve."},"DISC":{"inclusion":"¿Qué hábito concreto ayudaría a que un colega que habla menos sienta que tiene la invitación a participar?","engage":"¿Cómo distingues entre apoyar a alguien y centrar la conversación en ti?","develop":"¿Cómo podrías practicar preguntar “¿cómo puedo ayudar?” antes de actuar en nombre de alguien?","results":"¿Qué decisión de tu equipo podría haber sido mejor si alguien se hubiera sentido con seguridad para hablar antes?","accountability":"¿Qué patrón entre colegas vienes dejando pasar porque “formalmente no es tu trabajo”?","grow":"¿A quién podrías preguntarle si tu forma de apoyar a las personas es realmente útil?"}}},"pt":{"ui":{"docTitle":"The Mike Case: o que eu faço como par?","brand":"Como par","introTag":"Uma simulação para integrantes da equipe","introTitle":"The Mike Case: e se não é você quem lidera?","introLead":"Você não lidera a equipe. Mas estava na sala quando Mike, um colega sênior, tornou sem querer mais difícil que a voz de Alex fosse ouvida. A segurança psicológica não depende só de quem tem um cargo: também depende do que os pares fazem, ou deixam de fazer.","fwNote":"Mesmo sem autoridade formal, as suas escolhas são avaliadas com base no mesmo adidas Leadership Framework. A segurança psicológica afeta o desempenho da equipe, então \u003cb>Deliver Results\u003c/b> também conta aqui.","introFoot":"5 decisões, mais rápida do que a versão de liderança. A maioria não tem uma opção claramente perfeita.","resultNote":"Seu perfil vem do seu desempenho nos seis pilares abaixo: a segurança psicológica é algo que qualquer colega pode fortalecer ou enfraquecer, com ou sem um cargo de liderança.","planTitle":"Seu plano de ação como par"},"excel":[{"w":"Conecta o trabalho do dia a dia ao propósito, aos produtos, aos consumidores e à cultura da adidas, nas ações e não só nas palavras.","a":"Eu sinto mais conexão com a adidas por causa da forma como as pessoas ao meu redor se apresentam?"},{"w":"Assume de verdade a responsabilidade pelos resultados, equilibrando o impacto nas pessoas e no negócio.","a":"Eu assumo a responsabilidade pelos resultados mesmo quando é desconfortável, mesmo sem um cargo?"},{"w":"Olha para a frente, questiona a forma habitual de fazer as coisas e abre espaço para soluções melhores.","a":"Estou ajudando a equipe a olhar para a frente, ou só reagindo ao que está diante de nós?"}],"scored":{"inclusion":"Ajuda a criar um ambiente em que diferentes perspectivas são genuinamente valorizadas e incluídas.","engage":"Traz uma energia e uma clareza que ajudam as pessoas ao seu redor a fazer o seu melhor trabalho.","develop":"Apoia ativamente o crescimento de um colega com feedback honesto e específico.","results":"Ajuda a transformar boas ideias em resultados ao abrir espaço para que sejam ouvidas.","accountability":"Nomeia os problemas de forma construtiva em vez de deixá-los passar, mesmo sem autoridade formal.","grow":"Mantém a abertura ao feedback e a curiosidade sobre os próprios pontos cegos."},"phases":[{"title":"Você estava na sala","narrative":["Você não lidera a equipe. Mas estava na reunião quando Mike descartou, rindo, a ideia de Alex (\u003cem>“na verdade, a gente já tentou isso anos atrás, acho que toda pessoa nova precisa redescobrir os nossos velhos erros”\u003c/em>) e viu que Alex não falou mais nada até o fim da reunião.","Ninguém mais parece ter notado, ou talvez tenham notado e decidido não agir. Você não tem um cargo de liderança aqui, mas está claro que isso afetou Alex.","Você tem uma janela curta, ainda dentro da reunião, para decidir se faz alguma coisa."],"choices":[{"l":"Apoiar a ideia de Alex ali mesmo, sem confrontar Mike diretamente","t":"“Na verdade, acho que tem algo aqui. Alex, pode contar mais sobre como isso teria ajudado com o problema do mês passado?”","imm":"A conversa volta para a ideia de Alex, sem nomear o comentário de Mike. Alex parece continuar com um pouco mais de tranquilidade.","del":"Alex se lembra de que alguém trouxe a ideia de volta à mesa, mas o comentário de Mike em si nunca foi nomeado por ninguém.","why":"Isso devolve espaço a Alex sem transformar a reunião em um confronto que não cabe a você conduzir: uma forma real de agir sem autoridade formal. O custo é que o padrão em si fica sem nome, e por isso é mais fácil que se repita."},{"l":"Ficar em silêncio na reunião, mas falar com Alex em particular depois","t":"Você não diz nada na hora. Mais tarde, manda uma mensagem para Alex: “Vi o que aconteceu hoje. A sua ideia fez sentido para mim.”","imm":"Alex responde com um “valeu” breve, mas que soa genuíno.","del":"Alex sabe que pelo menos uma pessoa percebeu. Mas ninguém na sala viu isso acontecer, então a norma do grupo não muda.","why":"Uma demonstração de apoio em particular é real e de baixo risco: um bom primeiro passo se você não quer expor Alex ainda mais. O custo é que ela é invisível para o restante da equipe, que continua sem saber que aquele comentário incomodou alguém."},{"l":"Presumir que a liderança vai notar e resolver: não é o seu papel consertar isso","t":"Você conclui que intervir não cabe a você; a sua liderança está na sala e pode notar sem ajuda.","imm":"A reunião continua. Ninguém mais comenta.","del":"Semanas depois, você percebe que Alex quase não fala mais nas reuniões, e não consegue dizer se alguém, a começar por você, fez alguma coisa a respeito.","why":"É verdade que corrigir publicamente um colega não é tarefa de quem não conduz a reunião: essa hesitação é razoável. Mas a segurança psicológica não depende só de quem tem um cargo: esperar que outra pessoa aja também é uma escolha, e tem um custo."}]},{"title":"Mike interrompe de novo","narrative":["Duas semanas depois, Mike corta Alex no meio da explicação, de novo. A sugestão dele nem está errada, mas é a segunda vez neste mês. A sua liderança está na reunião e não reage.","Você é par de Alex, não lidera Mike. Ainda assim, o que você faz nos próximos segundos define o que a sala aprende que é normal."],"choices":[{"l":"Intervir, de leve, como par","t":"“Espera, deixa Alex terminar. Acho que tem mais ali.”","imm":"Mike para. “Foi mal”, diz. Alex conclui o ponto.","del":"Alex percebe que alguém além da liderança notou e agiu. Depois, Mike também fica um pouco mais cuidadoso com você.","why":"Um par intervir, e não só quem lidera, envia um sinal forte de que isso não depende só de quem tem um cargo. O risco é parecer que você está corrigindo em público um colega sênior, o que nem todo mundo na sala vai ver com bons olhos."},{"l":"Deixar passar, mas perguntar a Alex se quer apoio para levar o assunto à liderança","t":"Depois da reunião: “Percebi que o Mike te cortou de novo. Quer que eu fale com a nossa liderança junto com você, ou prefere resolver do seu jeito?”","imm":"Para Alex é um alívio que alguém tenha notado, mas há hesitação: “Não sei se quero transformar isso em uma questão.”","del":"A decisão fica, corretamente, com Alex, mas o padrão continua acontecendo enquanto a decisão não vem.","why":"Perguntar a Alex, em vez de decidir em seu nome, respeita a autonomia da pessoa mais afetada: exatamente o tipo de apoio que qualquer par pode oferecer. O custo é que a solução pode demorar mais enquanto o padrão continua se repetindo."},{"l":"Mandar uma mensagem direto para a liderança, sem falar antes com Alex","t":"Depois da reunião, você escreve para a sua liderança: “Percebi que o Mike cortou Alex de novo, achei que você deveria saber.”","imm":"A sua liderança agradece o aviso. Alex não sabe que essa conversa aconteceu.","del":"Se Alex descobrir depois, pode sentir que a sua situação virou assunto de outra pessoa sem nenhuma consulta, mesmo com boa intenção da sua parte.","why":"Avisar a liderança é uma atitude legítima e pode acelerar uma correção real. O custo é decidir isso sem incluir Alex, que provavelmente é quem mais tem a dizer sobre como e quando a própria situação é levantada."}]},{"title":"Falando você mesmo com Mike","narrative":["Você decide que o padrão está claro o bastante para que Mike ouça isso diretamente de um par, e não só da liderança. Você está avaliando o tom e o contexto: algo justo, respeitoso e que realmente chegue até ele.","Cada opção que você está considerando tem uma armadilha, embora nenhuma pareça claramente errada."],"choices":[{"l":"Publicar um lembrete geral no canal da equipe, sem citar o nome dele","t":"“Lembrete amigável: vamos garantir que as pessoas concluam o raciocínio antes de entrarmos na conversa. Vale para todo mundo :)”, você publica no canal da equipe.","imm":"Algumas pessoas reagem com um joinha. Mike não responde nada.","del":"Como foi dirigido a todo mundo, Mike pode razoavelmente presumir que não era com ele, e o padrão específico com Alex fica sem tratamento.","why":"Um lembrete público e geral evita apontar alguém, o que pode parecer a opção mais justa e de menor risco. O custo é que um feedback vago e dirigido a todo mundo permite que a única pessoa a quem ele realmente se refere não se sinta incluída, e não faz nada por Alex, que viu tudo acontecer e sabe exatamente de quem se tratava."},{"l":"Dizer a ele que “algumas pessoas perceberam”, sem dizer quem","t":"“Ei, algumas pessoas perceberam que você corta o pessoal nas reuniões. Talvez valha a pena prestar atenção.”","imm":"Mike é pego de surpresa. “Quem disse isso?”, pergunta. Você não responde.","del":"Mike passa os dias seguintes se perguntando quem está falando dele pelas costas, mais focado nisso do que no comportamento em si.","why":"Citar “algumas pessoas” pode parecer dar mais peso e protege qualquer pessoa de ser identificada como a fonte. Mas invocar um coletivo anônimo faz o feedback parecer vir de todo lugar e de lugar nenhum: fica difícil para Mike lidar com ele de verdade, e pode soar como um ataque em grupo, e não como um feedback honesto e assumido por alguém."},{"l":"Tocar no assunto de forma casual no happy hour da equipe, para parecer menos sério","t":"Nos drinks depois do trabalho, você comenta de leve: “Haha, hoje você calou Alex mesmo, hein?”","imm":"Mike ri na hora: “É, é, foi mal.” A conversa muda de assunto imediatamente.","del":"Como foi dito em tom de piada em um contexto social, Mike não registra isso como feedback, e nada muda.","why":"Um momento casual e social pode parecer a forma menos confrontadora de levantar algo, e às vezes funciona melhor do que uma conversa formal. O custo é que embrulhar um feedback real em uma piada, em um espaço que implicitamente está fora do trabalho, torna fácil para a outra pessoa não levar a sério, e mistura uma conversa corretiva em um espaço que deveria estar livre disso."}]},{"title":"Tentando ajudar","narrative":["Você finalmente decide falar com Alex sobre tudo isso. As suas intenções são boas, mas as três formas mais fáceis de abrir essa conversa têm um problema em comum, embora nenhuma pareça errada à primeira vista."],"choices":[{"l":"Minimizar, para tranquilizar","t":"“Não se preocupe, o Mike é assim com todo mundo, não é pessoal.”","imm":"Alex concorda com a cabeça, mas não parece sentir mais alívio: só vontade de encerrar o assunto.","del":"Alex aprende que levantar isso de novo provavelmente vai receber um “não é nada demais”, o que desestimula trazer o assunto se acontecer outra vez.","why":"Isso parece reconfortante e tenta aliviar o momento: uma intenção genuína. Mas minimizar invalida a experiência de Alex antes mesmo de você ter ouvido de verdade: decidir que “não é pessoal” não é uma decisão que cabe a você tomar em seu lugar."},{"l":"Colocar no centro uma experiência parecida sua","t":"“Ah, eu sei exatamente como é, ele faz isso comigo também, uma vez...”, e você continua com a sua própria história.","imm":"Alex ouve com educação, mas quase não consegue voltar ao próprio assunto.","del":"Alex sai da conversa com a sensação de que veio desabafar e acabou ouvindo a experiência de outra pessoa.","why":"Compartilhar uma experiência parecida pode criar uma conexão genuína e mostrar a Alex que isso não acontece só com uma pessoa. O problema é quando ela toma conta do espaço: a segurança psicológica de Alex depende de ter a sua voz ouvida, não de você sentir compreensão."},{"l":"Oferecer-se para resolver no lugar de Alex, sem perguntar antes","t":"“Deixa comigo, eu vou falar com o Mike sobre isso diretamente.”","imm":"Alex diz “tá bom”, com um pouco de incerteza, sem ter pedido isso.","del":"Se a conversa com Mike não for bem, Alex pode ficar no meio de uma tensão que não escolheu, e sem nenhuma consulta sobre como queria que a própria situação fosse tratada.","why":"Oferecer-se para tomar uma ação concreta vem de um cuidado real, e às vezes é exatamente o que alguém quer. O problema é presumir isso sem perguntar: tira de Alex a escolha sobre se e como a sua situação é tratada por outra pessoa."}]},{"title":"Quando (e como) escalar","narrative":["O padrão com Mike continua, semana após semana. Alex ainda não levantou o assunto formalmente. Você percebe que isso também está custando à equipe: boas ideias não chegam à mesa, e algumas decisões técnicas ficam mais lentas ou piores sem a contribuição de Alex.","Há mais de uma forma razoável de levar isso adiante, e cada uma tem um custo diferente."],"choices":[{"l":"Levantar o assunto agora, com o que você viu, mesmo sem Alex pedir","t":"Você marca um horário com a sua liderança e descreve o padrão que observou, deixando claro que é a sua própria leitura, não a de Alex.","imm":"A sua liderança agradece e diz que vai prestar mais atenção.","del":"Algo muda mais rápido, mas Alex pode se surpreender ao saber que a sua situação foi levantada sem que tenha escolhido o momento.","why":"Agir a partir do que você viu, com transparência de que é a sua própria leitura, é uma forma legítima de evitar que um padrão real espere demais, e se conecta diretamente à qualidade das decisões da equipe. O custo é decidir o momento por Alex, mesmo com boa intenção."},{"l":"Esperar um padrão ainda mais claro antes de levar isso a algum lugar","t":"Você decide que ainda não tem certeza suficiente e prefere continuar observando por mais um tempo.","imm":"Nada muda no curto prazo.","del":"O padrão se repete mais uma vez, de forma parecida, antes que alguém diga alguma coisa.","why":"Querer certeza antes de agir é uma forma genuína de cuidado e evita alarmes falsos. O risco é que você já viu esse padrão se repetir mais de uma vez: esperar que fique “ainda mais claro” pode virar uma forma de adiar indefinidamente."},{"l":"Usar um canal indireto: uma pesquisa de engajamento ou uma ferramenta de feedback anônimo","t":"Você registra o que observou no canal de feedback anônimo da empresa, sem citar pessoas específicas.","imm":"Fica registrado, sem expor ninguém diretamente.","del":"Pode demorar mais para virar uma ação concreta, e não está claro se alguém vai relacionar esse registro à situação de Alex.","why":"Um canal indireto é uma ferramenta real quando uma conversa direta parece arriscada demais, e não exige que ninguém se exponha. O custo é a velocidade, e a chance de o sinal se perder entre outros registros."}]}],"profiles":{"champion":{"name":"Apoio consistente à segurança psicológica","sum":"Mesmo sem um cargo de liderança, você agiu de forma consistente, respeitosa e específica, protegendo o espaço de quem tinha menos poder na sala, mesmo quando tecnicamente não era o seu trabalho.","str":"Percebe os padrões cedo. Age com cuidado pela autonomia da outra pessoa. Não espera passivamente por quem tem o cargo.","risk":"Atenção para não assumir o papel de “resolver” pelos outros: pergunte antes de agir em nome de alguém."},"inconsistent":{"name":"Boas intenções, apoio inconsistente","sum":"Você se importa, mas as suas respostas variaram: às vezes um apoio real e cuidadoso, outras vezes evasão ou fazer o momento girar em torno de você.","str":"Cuidado genuíno com colegas.","risk":"A inconsistência pode confundir quem precisa de um apoio previsível, e não ocasional."},"avoider":{"name":"Observação cautelosa","sum":"Você tende a esperar que a liderança formal resolva as coisas, mesmo quando percebe que algo está errado. É compreensível, não é o seu cargo, mas tem um custo real para a pessoa afetada.","str":"Respeita a hierarquia e evita passar dos limites.","risk":"O silêncio pode ser lido como concordância, mesmo sem querer."},"silencer":{"name":"Reforço não intencional","sum":"As suas escolhas (minimizar, colocar-se no centro, agir sem perguntar) provavelmente tornaram mais difícil, sem querer, que Alex sentisse uma escuta real. Isso é comum entre colegas bem-intencionados.","str":"Desejo real de ajudar.","risk":"Boas intenções não garantem que a pessoa afetada sinta apoio."}},"plan":{"CONT":{"inclusion":"Devolver a palavra a colegas que falam menos quando você percebe o espaço se fechando.","engage":"Levar leveza e confiança para os momentos tensos entre colegas.","develop":"Oferecer um apoio específico, e não apenas genérico, a quem precisa.","results":"Perceber quando o silêncio de um colega pode estar custando qualidade à equipe.","accountability":"Nomear os padrões, mesmo sem um cargo, em vez de esperar por quem tem um.","grow":"Perguntar antes de agir em nome de outra pessoa."},"START":{"inclusion":"Convidar ativamente colegas que falam menos a voltar para a conversa.","engage":"Usar a tensão como oportunidade de conexão, e não só como um desconforto a evitar.","develop":"Oferecer apoio concreto perguntando do que a pessoa realmente precisa.","results":"Conectar o seu apoio a decisões técnicas melhores para a equipe.","accountability":"Levantar padrões repetidos, mesmo quando formalmente não é o seu papel.","grow":"Perguntar a um colega de confiança se o seu jeito de ajudar realmente ajuda."},"COMMIT":{"inclusion":"Na próxima reunião, vou notar quem parou de falar e trazer essa pessoa de volta para a conversa.","engage":"Da próxima vez que um colega passar por algo difícil, vou perguntar como apoiar antes de agir.","develop":"Nesta semana, vou oferecer a um colega um apoio específico, não genérico.","results":"Nesta semana, vou notar se algum silêncio na equipe pode estar nos custando uma decisão melhor.","accountability":"Nesta semana, vou nomear um padrão que venho deixando passar, mesmo que formalmente não seja o meu papel.","grow":"Neste mês, vou perguntar a um colega se o meu jeito de apoiar realmente ajuda."},"DISC":{"inclusion":"Que hábito concreto ajudaria um colega que fala menos a sentir que tem o convite para participar?","engage":"Como você diferencia apoiar alguém de centrar a conversa em você?","develop":"Como você poderia praticar perguntar “como posso ajudar?” antes de agir em nome de alguém?","results":"Que decisão da sua equipe poderia ter sido melhor se alguém tivesse se sentido em segurança para falar antes?","accountability":"Que padrão entre colegas você vem deixando passar porque “formalmente não é o seu trabalho”?","grow":"A quem você poderia perguntar se o seu jeito de apoiar as pessoas é realmente útil?"}}}}};
const DIMS=['inclusion','engage','develop','results','accountability','grow'];
// Nombres oficiales del adidas Leadership Framework: se mantienen en ingles en todos los idiomas
const LABEL={inclusion:'Foster Inclusion',engage:'Engage & Inspire',develop:'Develop Talent',results:'Deliver Results',accountability:'Promote Accountability',grow:'Grow Yourself'};
const LABEL_FULL={inclusion:'Build a Diverse Team and Foster Inclusion',engage:'Engage and Inspire',develop:'Develop Talent',results:'Deliver Results',accountability:'Promote Accountability',grow:'Continue to Grow Yourself'};
const GROUPNAME={inclusion:'Empower',engage:'Empower',develop:'Empower',results:'Elevate',accountability:'Elevate',grow:'Elevate'};
const LANGS=['en','es','pt'];
const LANGNAME={en:'English',es:'Español',pt:'Português'};
const UI={
en:{of:'of',whatDo:'What do you do?',outcome:'Outcome',youChose:'You chose',immediate:'Immediate reaction',down:'Down the line',leaned:'Pillars this choice leaned into',left:'Pillars left on the table this time',none:'None, this time',why:'Why',cont:'Continue →',seeResults:'See Your Results',complete:'Simulation Complete',strengths:'Strengths',risks:'Risks to watch',seePlan:'See Your Action Plan →',restart:'Restart',planTag:'Action Plan',your:'Your',focusTag:'Focus Pillar for Group Discussion',scoredLow:'Scored {n}/100 — the lowest of the six pillars',contDoing:'Continue Doing',startDoing:'Start Doing',commit30:'One Commitment for the Next 30 Days',print:'Print / Save as PDF',yourName:'Your name',placeholder:'e.g. Jordan Lee',begin:'Begin the Simulation',excelTag:'shown for context, not scored here',scoredTag:'scored in this simulation',anonymous:'Anonymous'},
es:{of:'de',whatDo:'¿Qué haces?',outcome:'Resultado',youChose:'Elegiste',immediate:'Reacción inmediata',down:'Más adelante',leaned:'Pilares que esta decisión fortaleció',left:'Pilares que quedaron sin trabajar esta vez',none:'Ninguno esta vez',why:'Por qué',cont:'Continuar →',seeResults:'Ver tus resultados',complete:'Simulación completa',strengths:'Fortalezas',risks:'Riesgos a observar',seePlan:'Ver tu plan de acción →',restart:'Reiniciar',planTag:'Plan de acción',your:'Tu',focusTag:'Pilar de foco para la discusión grupal',scoredLow:'Puntaje {n}/100: el más bajo de los seis pilares',contDoing:'Seguir haciendo',startDoing:'Empezar a hacer',commit30:'Un compromiso para los próximos 30 días',print:'Imprimir / Guardar como PDF',yourName:'Tu nombre',placeholder:'ej.: Ana Pérez',begin:'Comenzar la simulación',excelTag:'se muestra como contexto, no se evalúa aquí',scoredTag:'se evalúa en esta simulación',anonymous:'Anónimo'},
pt:{of:'de',whatDo:'O que você faz?',outcome:'Resultado',youChose:'Você escolheu',immediate:'Reação imediata',down:'Mais adiante',leaned:'Pilares que esta escolha fortaleceu',left:'Pilares que ficaram de fora desta vez',none:'Nenhum desta vez',why:'Por quê',cont:'Continuar →',seeResults:'Ver seus resultados',complete:'Simulação concluída',strengths:'Pontos fortes',risks:'Riscos a observar',seePlan:'Ver seu plano de ação →',restart:'Reiniciar',planTag:'Plano de ação',your:'Seu',focusTag:'Pilar de foco para a discussão em grupo',scoredLow:'Pontuação {n}/100: a mais baixa dos seis pilares',contDoing:'Continuar fazendo',startDoing:'Começar a fazer',commit30:'Um compromisso para os próximos 30 dias',print:'Imprimir / Salvar como PDF',yourName:'Seu nome',placeholder:'ex.: Ana Souza',begin:'Iniciar a simulação',excelTag:'exibido como contexto, não avaliado aqui',scoredTag:'avaliado nesta simulação',anonymous:'Anônimo'}
};
const KEYS=['A','B','C'];

let lang=(()=>{const q=new URLSearchParams(location.search).get('lang');return LANGS.includes(q)?q:null;})();
function fresh(){return {screen:lang?'intro':'lang',name:'',idx:0,scores:{inclusion:60,engage:60,develop:60,results:60,accountability:60,grow:60},log:[],cur:null};}
let state=fresh();

const T=()=>GAME.t[lang], U=k=>UI[lang][k], S=k=>GAME.t[lang].ui[k];
function clamp(v){return Math.max(0,Math.min(100,v));}
function esc(s){const d=document.createElement('div');d.innerText=s==null?'':s;return d.innerHTML;}
function finalScore(){return Math.round(DIMS.reduce((s,c)=>s+state.scores[c],0)/DIMS.length);}
function profileKey(){const sc=state.scores,s=finalScore();
 if(s>=80)return 'champion'; if(s>=60)return 'inconsistent';
 return (sc.engage<=sc.accountability)?'avoider':'silencer';}
function tag(){return (state.idx+1)+' '+U('of')+' '+T().phases.length;}

function setLang(l){
 lang=l;
 try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u);}catch(e){}
 if(state.screen==='lang')state.screen='intro';
 render();
}
function langSwitch(){return `<div class="langs">${LANGS.map(l=>`<button class="${l===lang?'on':''}" onclick="keepName();setLang('${l}')">${l.toUpperCase()}</button>`).join('')}</div>`;}
function keepName(){const i=document.getElementById('nm');if(i)state.name=i.value;}

function topbar(){
 if(state.screen==='lang')return '';
 const brand=`<div class="brand">The Mike Case <span style="color:var(--dim)">/</span> <b>${S('brand')}</b></div>`;
 if(state.screen==='intro')return `<div class="top">${brand}${langSwitch()}</div>`;
 return `<div class="top">${brand}<div class="tag">${tag()}</div></div>`;
}

function renderLang(){
 return `<main><div class="stage lang">
 <div class="tag" style="margin-bottom:8px">Choose your language · Elige tu idioma · Escolha seu idioma</div>
 <h1 style="font-size:40px;line-height:1.1;margin-bottom:10px">The Mike Case</h1>
 <p style="font-size:16px;color:var(--gold);font-weight:600;margin:0 0 28px">${[...new Set(LANGS.map(l=>GAME.t[l].ui.brand))].join(' \u00b7 ')}</p>
 ${LANGS.map(l=>`<button class="choice" onclick="setLang('${l}')"><div class="cl">${l.toUpperCase()}</div><div class="clabel">${LANGNAME[l]}</div><div class="arrow">→</div></button>`).join('')}
 </div></main>`;
}

function renderIntro(){
 const t=T();
 const excelHtml=t.excel.map((x,i)=>`<div class="fwItem mute"><b>${GAME.excelNames[i]}</b>${x.w}<span class="ask">“${x.a}”</span></div>`).join('');
 const col=ds=>ds.map(d=>`<div class="fwItem"><b>${LABEL_FULL[d]}</b>${t.scored[d]}</div>`).join('');
 return `<main><div class="stage">
 <div class="tag" style="margin-bottom:8px">${S('introTag')}</div>
 <h1>${S('introTitle')}</h1>
 <p style="font-size:17px;color:#f0e2d6;max-width:56ch">${S('introLead')}</p>
 <div class="fw">
  <p style="font-size:13px;color:var(--dim);margin:0 0 16px">${S('fwNote')}</p>
  <div class="fwGrid">
   <div class="fwCol"><span class="badge">Excel</span><span class="tagline">${U('excelTag')}</span>${excelHtml}</div>
   <div class="fwCol"><span class="badge">Empower</span><span class="tagline">${U('scoredTag')}</span>${col(['inclusion','engage','develop'])}</div>
   <div class="fwCol"><span class="badge">Elevate</span><span class="tagline">${U('scoredTag')}</span>${col(['results','accountability','grow'])}</div>
  </div>
 </div>
 <p style="font-size:14px;color:var(--dim);max-width:56ch">${S('introFoot')}</p>
 <label for="nm" style="display:block;font-size:12px;text-transform:uppercase;color:var(--dim);margin:20px 0 6px">${U('yourName')}</label>
 <input type="text" id="nm" value="${esc(state.name)}" placeholder="${U('placeholder')}" onkeydown="if(event.key==='Enter')start()">
 <div><button class="btn" onclick="start()">${U('begin')}</button></div>
 </div></main>`;
}

function renderPhase(){
 const p=T().phases[state.idx];
 const nar=p.narrative.map(x=>`<p>${x}</p>`).join('');
 const ch=p.choices.map((c,i)=>`<button class="choice" onclick="pick(${i})"><div class="cl">${KEYS[i]}</div><div><div class="clabel">${esc(c.l)}</div><div class="ctext">${c.t}</div></div></button>`).join('');
 return `<main><div class="stage"><h1>${esc(p.title)}</h1><div class="narrative">${nar}</div><div class="div"></div><div class="tag" style="margin-bottom:14px">${U('whatDo')}</div>${ch}</div></main>`;
}

function renderConseq(){
 const i=state.cur,c=T().phases[state.idx].choices[i],d=GAME.d[state.idx][i];
 const on=DIMS.filter(k=>(d[k]||0)>0),off=DIMS.filter(k=>(d[k]||0)<=0);
 const chip=(k,active)=>`<span class="chip ${active?'on':''}">${GROUPNAME[k]} · ${LABEL[k]}</span>`;
 const none=`<span class="chip muted">${U('none')}</span>`;
 const last=state.idx===T().phases.length-1;
 return `<main><div class="stage"><div class="tag" style="margin-bottom:14px">${tag()} · ${U('outcome')}</div>
 <div class="conseq">
 <div class="tag" style="color:var(--gold);margin-bottom:10px">${U('youChose')}: ${KEYS[i]}. ${esc(c.l)}</div>
 <h4>${U('immediate')}</h4><p>${c.imm}</p>
 <h4>${U('down')}</h4><p>${c.del}</p>
 <div class="impLabel">${U('leaned')}</div>
 <div class="chips">${on.length?on.map(k=>chip(k,true)).join(''):none}</div>
 <div class="impLabel">${U('left')}</div>
 <div class="chips">${off.length?off.map(k=>chip(k,false)).join(''):none}</div>
 <h4 style="margin-top:18px">${U('why')}</h4><p style="margin:0">${c.why}</p>
 </div>
 <button class="btn" onclick="next()">${last?U('seeResults'):U('cont')}</button>
 </div></main>`;
}

function devPlan(){
 const P=T().plan;
 const sorted=DIMS.slice().sort((a,b)=>state.scores[b]-state.scores[a]);
 const weakest=sorted[sorted.length-1];
 return {cont:sorted.slice(0,2).map(d=>P.CONT[d]),start:sorted.slice(-2).reverse().map(d=>P.START[d]),commit:P.COMMIT[weakest],disc:P.DISC[weakest],weakest};
}

function renderResults(){
 const pr=T().profiles[profileKey()];
 const bars=DIMS.map(d=>`<div class="bar"><div class="bn">${GROUPNAME[d]} · ${LABEL[d]}</div><div class="bt"><div class="bf" style="width:${state.scores[d]}%"></div></div><div style="text-align:right">${state.scores[d]}</div></div>`).join('');
 return `<main><div class="stage">
 <div class="tag" style="margin-bottom:14px">${U('complete')}</div>
 <div class="note">${S('resultNote')}</div>
 <div class="profile">${pr.name}</div>
 <p style="color:#f0e2d6;max-width:60ch">${pr.sum}</p>
 <div style="margin:22px 0 8px">${bars}</div>
 <div class="sec"><h4>${U('strengths')}</h4><p style="font-size:14.5px;color:#f0e2d6">${pr.str}</p></div>
 <div class="sec"><h4>${U('risks')}</h4><p style="font-size:14.5px;color:#f0e2d6">${pr.risk}</p></div>
 <button class="btn" onclick="showPlan()">${U('seePlan')}</button>
 <button class="btn sec" onclick="restart()" style="margin-left:8px">${U('restart')}</button>
 </div></main>`;
}

function renderPlan(){
 const pl=devPlan();
 const who=state.name?esc(state.name):U('your');
 return `<main><div class="stage"><div class="card">
 <div class="tag" style="color:var(--gold)">${who} · ${U('planTag')}</div>
 <h2>${S('planTitle')}</h2>
 <div class="focus">
  <div class="tag">${GROUPNAME[pl.weakest]} · ${U('focusTag')}</div>
  <b class="name">${LABEL_FULL[pl.weakest]}</b>
  <div style="font-size:12px;color:var(--dim);margin-bottom:10px">${U('scoredLow').replace('{n}',state.scores[pl.weakest])}</div>
  <div style="font-style:italic;border-left:2px solid var(--gold);padding-left:12px;font-size:14px">${pl.disc}</div>
 </div>
 <div class="sec"><h4>${U('contDoing')}</h4><ul>${pl.cont.map(t=>`<li>${t}</li>`).join('')}</ul></div>
 <div class="sec"><h4>${U('startDoing')}</h4><ul>${pl.start.map(t=>`<li>${t}</li>`).join('')}</ul></div>
 <div class="sec"><h4>${U('commit30')}</h4><p class="commit">${pl.commit}</p></div>
 </div>
 <button class="btn" onclick="window.print()">${U('print')}</button>
 <button class="btn sec" onclick="restart()" style="margin-left:8px">${U('restart')}</button>
 </div></main>`;
}

function render(){
 const el=document.getElementById('app'); let b='';
 if(state.screen==='lang')b=renderLang();
 else if(state.screen==='intro')b=renderIntro();
 else if(state.screen==='phase')b=renderPhase();
 else if(state.screen==='conseq')b=renderConseq();
 else if(state.screen==='results')b=renderResults();
 else if(state.screen==='plan')b=renderPlan();
 document.documentElement.lang=lang||'en';
 document.title=lang?S('docTitle'):'The Mike Case';
 el.innerHTML=topbar()+b; window.scrollTo(0,0);
}
function start(){const i=document.getElementById('nm');state.name=(i&&i.value.trim())||U('anonymous');state.screen='phase';state.idx=0;render();}
function pick(i){const d=GAME.d[state.idx][i];DIMS.forEach(k=>state.scores[k]=clamp(state.scores[k]+(d[k]||0)));state.log.push({phase:state.idx+1,choice:KEYS[i]});state.cur=i;state.screen='conseq';render();}
function next(){state.cur=null; if(state.idx<T().phases.length-1){state.idx++;state.screen='phase';}else{state.screen='results';} render();}
function showPlan(){state.screen='plan';render();}
function restart(){state=fresh();state.screen='intro';render();}
render();
</script>
</body></html>
