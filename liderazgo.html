<title>The Mike Case</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a0d13;--ink2:#5c1420;--panel:#4a1520;--panel2:#5c1c28;--paper:#f5ece0;--dim:#d9b6ab;--gold:#f2a71b;--line:rgba(245,236,224,.16);--lineS:rgba(245,236,224,.32);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:linear-gradient(150deg,var(--ink),var(--ink2) 60%,#42111a);color:var(--paper);font-family:Inter,sans-serif;line-height:1.55;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);min-height:100vh}
h1,h2,.serif{font-family:Fraunces,serif}
.top{position:sticky;top:0;z-index:10;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0));background:rgba(58,13,19,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{font-size:13px;color:var(--dim)}.brand b{color:var(--paper)}
.langs{display:flex;gap:4px}
.langs button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--dim);background:none;border:1px solid transparent;padding:5px 8px;cursor:pointer}
.langs button.on{color:var(--paper);border-color:var(--lineS)}
main{display:flex;justify-content:center;padding:44px 20px 90px}
.stage{max-width:660px;width:100%}
h1{font-size:30px;margin:4px 0 22px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.narrative p{font-size:16.5px;color:#f0e2d6;max-width:60ch;margin:0 0 14px}
em{color:var(--paper);font-style:italic}
.div{height:1px;background:var(--line);margin:28px 0}
.choice{display:flex;gap:14px;border:1px solid var(--line);border-left:3px solid var(--lineS);background:rgba(0,0,0,.14);padding:16px 18px;margin-bottom:10px;width:100%;text-align:left;cursor:pointer;color:var(--paper);font-family:inherit}
.choice:hover{border-left-color:var(--gold);background:rgba(0,0,0,.26)}
.cl{font-family:Fraunces,serif;color:var(--gold);font-size:19px;min-width:20px}
.clabel{font-weight:600;margin-bottom:3px}
.ctext{font-size:14px;color:#e6cfc2}
.lang .choice{align-items:center;padding:20px}
.lang .clabel{font-family:Fraunces,serif;font-size:21px;margin:0}
.lang .arrow{margin-left:auto;color:var(--gold);font-size:20px}
.conseq{border:1px solid var(--lineS);background:rgba(0,0,0,.22);padding:24px}
.conseq h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 6px}
.conseq p{margin:0 0 16px;font-size:14.5px;color:#f0e2d6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font-size:12px;padding:5px 9px;border:1px solid var(--lineS);display:inline-flex;gap:6px;align-items:center;color:var(--paper)}
.chip.on{border-color:rgba(242,167,27,.6);background:rgba(242,167,27,.1)}
.chip.muted{color:var(--dim);font-style:italic}
.impLabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 8px}
.btn{background:var(--gold);color:#2a0a0e;border:none;padding:12px 24px;font-weight:700;cursor:pointer;margin-top:20px;font-size:14.5px;font-family:inherit}
.btn.sec{background:none;color:var(--paper);border:1px solid var(--lineS)}
input[type=text]{width:100%;max-width:340px;background:rgba(0,0,0,.2);border:1px solid var(--lineS);color:var(--paper);padding:11px 13px;margin-bottom:20px;font-size:16px}
.fw{border:1px solid var(--lineS);background:rgba(0,0,0,.15);padding:22px;margin:8px 0 28px}
.fw b{color:var(--paper)}
.fwGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
@media(max-width:700px){.fwGrid{grid-template-columns:1fr}}
.badge{display:inline-block;background:var(--gold);color:#2a0a0e;font-weight:700;font-size:10.5px;letter-spacing:.06em;padding:3px 9px;margin-bottom:10px;text-transform:uppercase}
.fwCol .tagline{font-size:9.5px;color:var(--dim);text-transform:none;letter-spacing:0;margin-left:6px}
.fwItem{font-size:13px;color:#e6cfc2;margin-bottom:10px;padding-left:10px;border-left:2px solid var(--line)}
.fwItem.mute{opacity:.7}
.fwItem b{display:block;color:var(--paper);font-size:12.5px;margin-bottom:2px}
.fwItem .ask{display:block;margin-top:4px;font-style:italic;color:var(--dim);font-size:11.5px}
.note{font-size:13px;color:var(--dim);border-left:2px solid var(--gold);padding-left:12px;max-width:58ch;margin:14px 0}
.finalNum{font-family:Fraunces,serif;font-size:76px;font-weight:600;line-height:1;margin:6px 0 2px}
.sub{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:26px}
.bar{display:grid;grid-template-columns:170px 1fr 32px;gap:12px;align-items:center;margin-bottom:12px}
.bn{font-size:12px;color:var(--dim)}
.bt{height:6px;background:rgba(245,236,224,.15)}.bf{height:100%;background:var(--gold)}
.profile{font-family:Fraunces,serif;color:var(--gold);font-size:22px;margin:20px 0 10px}
.focus{border:1px solid var(--gold);background:rgba(242,167,27,.1);padding:18px 20px;margin:22px 0}
.focus b.name{display:block;font-family:Fraunces,serif;font-size:20px;margin:8px 0 6px}
.card{border:1px solid var(--lineS);padding:28px;background:rgba(0,0,0,.18)}
.sec{margin-bottom:20px}
.sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
.sec ul{margin:0;padding-left:18px}
.sec li{font-size:14.5px;color:#f0e2d6;margin-bottom:6px}
.commit{font-style:italic;border-left:2px solid var(--gold);padding-left:12px;font-size:15px}
@media print{.top,.btn{display:none!important}body{background:#fff;color:#111}.card{border-color:#999;background:#fff}}
</style>
</head>

const GAME={"id":"leader","excelNames":["Live Your Passion for the Brand","Act Like It’s Your Own Company","Think Bigger and Beyond"],"d":[[{"inclusion":-6,"engage":-4,"develop":0,"results":-2,"accountability":-6,"grow":-2},{"inclusion":8,"engage":5,"develop":4,"results":2,"accountability":7,"grow":3},{"inclusion":-3,"engage":-1,"develop":0,"results":0,"accountability":-3,"grow":1}],[{"inclusion":7,"engage":-3,"develop":1,"results":-2,"accountability":6,"grow":1},{"inclusion":1,"engage":2,"develop":3,"results":4,"accountability":4,"grow":2},{"inclusion":2,"engage":1,"develop":1,"results":1,"accountability":-2,"grow":0}],[{"inclusion":-1,"engage":0,"develop":-3,"results":0,"accountability":-6,"grow":-2},{"inclusion":-1,"engage":-1,"develop":-4,"results":-1,"accountability":-3,"grow":-1},{"inclusion":-4,"engage":-1,"develop":-2,"results":0,"accountability":1,"grow":-1}],[{"inclusion":-1,"engage":3,"develop":-4,"results":0,"accountability":-8,"grow":-2},{"inclusion":6,"engage":6,"develop":10,"results":5,"accountability":10,"grow":6},{"inclusion":-2,"engage":-6,"develop":-5,"results":-1,"accountability":8,"grow":-2}],[{"inclusion":-2,"engage":-4,"develop":-3,"results":0,"accountability":2,"grow":-3},{"inclusion":-1,"engage":-2,"develop":-2,"results":0,"accountability":-2,"grow":-2},{"inclusion":-3,"engage":-3,"develop":-1,"results":0,"accountability":0,"grow":-1}],[{"inclusion":2,"engage":4,"develop":2,"results":2,"accountability":1,"grow":4},{"inclusion":0,"engage":-2,"develop":5,"results":4,"accountability":8,"grow":1},{"inclusion":-4,"engage":-1,"develop":-5,"results":-3,"accountability":-6,"grow":-6}]],"t":{"en":{"ui":{"docTitle":"The Mike Case — Leadership Simulation","brand":"Leadership Simulation","introTag":"A Leadership Simulation","introTitle":"The Mike Case","introLead":"You manage a team of eight. Mike is senior, funny, well-liked — and, without meaning to, makes it harder for newer voices to be heard. What you do about it defines what your team believes is safe to say out loud.","fwNote":"Every decision is scored against the adidas Leadership Framework. Psychological safety isn’t a standalone skill — it’s the outcome of these pillars practiced consistently. Because this directly affects team performance, \u003cb>Deliver Results\u003c/b> is scored here too, alongside Empower and Elevate.","introFoot":"6 decisions. Most have no clearly perfect option — reasonable leaders would choose differently. At the end you get a profile and one pillar to focus on for group discussion.","resultNote":"This score comes from your performance across the six pillars below — psychological safety is the outcome of consistent leadership behavior, not a standalone skill.","planTitle":"Your Psychological Safety Action Plan"},"excel":[{"w":"Connects the team’s work to adidas’ purpose, products, consumers, and culture — in decisions, not just words.","a":"Do I feel more connected to adidas because of how my leader shows up?"},{"w":"Takes real ownership, balancing business impact, people, and long-term consequences.","a":"Does my leader take ownership for decisions and outcomes even when it’s uncomfortable?"},{"w":"Looks ahead, challenges today’s way of working, and creates space for better solutions.","a":"Does my leader help us look ahead, or are we mostly reacting to day-to-day demand?"}],"scored":{"inclusion":"Creates an environment where different perspectives are genuinely valued and included.","engage":"Gives clear direction and energy that helps people do their best work.","develop":"Actively supports growth through feedback, trust, and opportunities.","results":"Helps turn goals into outcomes by focusing on what truly creates value.","accountability":"Sets clear expectations and addresses issues constructively.","grow":"Role models learning and openness to feedback."},"phases":[{"title":"The Comment","narrative":["Your team is midway through the weekly meeting. Alex, who joined two months ago, proposes a new approach to client onboarding — a little raw, but promising.","Mike, a senior engineer, chuckles and leans back: \u003cem>“We actually tried that years ago,”\u003c/em> he says, smiling. A few people laugh along.","Still friendly, he adds: \u003cem>“I guess every new hire has to rediscover our old mistakes.”\u003c/em> Alex smiles too — but it doesn’t reach their eyes. They go quiet for the rest of the meeting.","It was a quick comment, mildly funny even. You have maybe two seconds to decide if it’s worth pausing the meeting for."],"choices":[{"l":"Laugh along and move on","t":"Mike is well-liked, and it was — technically — a joke. Calling it out might make you the one who kills the room’s energy.","imm":"The meeting continues smoothly. Mike feels affirmed. Alex says nothing else for the rest of the meeting.","del":"In the following weeks, Alex’s contributions in meetings drop off almost entirely — though it’s hard to say for certain this is why.","why":"This keeps the meeting light and doesn’t make a small joke into a bigger deal — a defensible instinct in the moment. The cost is that, in real time, you can’t actually know whether this was harmless or the first domino."},{"l":"Name it respectfully, right there","t":"“Mike, I know that wasn’t meant to sting — but let’s make sure new ideas get a fair hearing, regardless of what we’ve tried before. Alex, can you say more about what’s different this time?”","imm":"The room goes quiet for a second. Mike looks surprised but nods: “Fair enough.” Alex, hesitant, keeps explaining.","del":"In the following weeks, others are slightly more willing to speak up — though Mike also seems a bit more guarded around you.","why":"Naming it in the moment protects Alex and signals what’s acceptable, in real time. It also means correcting a well-liked colleague in front of the whole team over what was, on its face, a small comment."},{"l":"Stay silent and move the discussion forward","t":"“Good point — let’s also hear from the rest of the team.” You redirect without naming the comment, planning to watch for a pattern.","imm":"The meeting continues without friction. Nobody seems to notice anything happened.","del":"Alex is a little quieter in the next few meetings. You’re not sure if it’s related.","why":"Keeping the meeting moving avoids turning one comment into a confrontation and gives you room to watch before reacting. The risk is that watching and not noticing look identical, from Alex’s side."}]},{"title":"Mike Interrupts Again","narrative":["Two weeks later. Alex is walking the team through a fix for a recurring bug. Mid-sentence, Mike jumps in: \u003cem>“Actually, I think the faster path is just to patch it at the API layer.”\u003c/em>","Alex stops talking. Mike isn’t wrong, technically — it might even be the better fix. But it’s the second time this month he’s cut Alex off before finishing a thought. Nobody else seems to notice.","You have maybe three seconds to decide what, if anything, you do — in front of the whole team."],"choices":[{"l":"Call it out immediately, in the room","t":"“Hold on, Mike — let Alex finish the thought first.”","imm":"The room goes quiet. Alex finishes, a little flustered. Mike raises his hands: “Sorry, sorry — go ahead.”","del":"Alex seems to stand a little straighter in the meetings that follow. Mike is noticeably quieter for the rest of this one.","why":"Correcting it live protects the moment for Alex and shows the whole team what’s expected. It also means correcting a senior, well-liked colleague in front of the group over a technical suggestion that wasn’t even wrong."},{"l":"Let it pass, address it with Mike privately right after","t":"The meeting continues. Afterward, you catch Mike: “You’ve cut Alex off twice this month. Leave room for them to finish.”","imm":"The meeting stays smooth. Privately, Mike takes the note without much reaction: “Noted, sorry about that.”","del":"Alex never sees the correction happen. From their side, the meeting felt like the ones before it.","why":"A private word protects Mike from public embarrassment and keeps the meeting’s energy intact. The cost is that Alex never actually sees the correction happen, so the room’s unspoken read of what’s acceptable doesn’t change."},{"l":"Redirect neutrally without naming what happened","t":"“Alex, keep going — we’ll circle back to Mike’s point.”","imm":"The meeting continues without confrontation. Alex finishes their point.","del":"A similar moment happens again the following week. It’s starting to look less like a slip and more like a habit specific to Alex.","why":"This keeps things moving and gives Alex room to finish without confrontation. The risk is that it treats the interruption as incidental rather than a pattern worth naming, so nothing about the norm actually changes."}]},{"title":"Writing the Review","narrative":["Performance review season arrives. You need to put this pattern in writing as part of Mike’s formal review — something that will follow him, and that he’ll read.","You’re weighing a few ways to phrase it. None of them look outright wrong on paper — but each has a catch you won’t fully see until after it’s written."],"choices":[{"l":"Keep it in your private manager notes, without telling Mike it’s there","t":"You add a confidential note to your own file flagging the pattern as something to monitor, without raising it with Mike directly.","imm":"Mike’s review reads fine to him. He has no idea anything was flagged.","del":"If this ever factors into a promotion or bonus decision, Mike will have had no chance to respond to something he never knew existed.","why":"Keeping a private note feels cautious, and avoids an uncomfortable conversation before you’re fully ready to have it. But documenting something that can affect Mike’s career without ever telling him breaks the basic fairness of feedback — he can’t improve on, or contest, something he’s never been told exists."},{"l":"Frame it as a general trait — “needs to build more patience with junior talent”","t":"You write the note in general terms, without tying it to the specific comments or moments you actually saw.","imm":"Mike reads it and isn’t sure what, specifically, to change. “I guess I’ll try to be more patient?”","del":"Without specifics, the same pattern is likely to repeat, and next year’s review may say something similar, just as vaguely.","why":"A general trait note avoids relitigating specific, possibly disputed moments, and feels less confrontational to write. But turning a behavior into a personality label gives Mike nothing concrete to act on — and character-level feedback is exactly where people get defensive instead of reflective."},{"l":"Include a detail from Alex’s private conversation with you, without naming them, as evidence","t":"You add a line referencing that “a team member privately shared feeling shut down in meetings” — specific enough that Mike could likely guess who.","imm":"Mike reads it and, within a day, asks Alex directly: “Hey, did you say something to our manager about me?”","del":"Alex feels blindsided that a private conversation became identifiable evidence, and is now warier of ever confiding in you again.","why":"Grounding feedback in a real, specific moment is exactly what makes it credible and actionable. The cost here is doing it in a way that’s traceable back to Alex without their consent — it turns someone’s trust in you into evidence they didn’t agree to provide, and teaches your team that confiding in you isn’t actually safe."}]},{"title":"The Difficult Conversation","narrative":["You ask Mike for fifteen minutes. Before you can open the conversation, he says, with an easy laugh: \u003cem>“If this is about that joke, I think people are becoming a little too sensitive these days.”\u003c/em>","After you’ve made your point, he adds: \u003cem>“Understood. I’ll try to sound less experienced next time”\u003c/em> — a wry smile — \u003cem>“but I wasn’t trying to discourage anyone.”\u003c/em>","He hasn’t fully connected the dots yet. You’ve already said your piece once. How much more is worth saying right now is a genuinely close call."],"choices":[{"l":"Keep it warm, mention it lightly, wrap up","t":"“Just something to think about,” you say, and end the conversation there.","imm":"The conversation ends on an easy note. Mike leaves feeling heard rather than lectured.","del":"Without reinforcement, Mike’s takeaway settles into something closer to “be a little nicer,” not a specific pattern to change.","why":"Ending here respects that you’ve already delivered clear feedback — repeating yourself can suggest you don’t trust him to have understood. The risk is that his last comment suggests he hasn’t fully connected the dots, and you’re choosing not to check."},{"l":"Be specific — situation, behavior, impact — and hold the line even after his first response","t":"“I hear that you weren’t trying to discourage anyone — I believe that. And the impact still happened, regardless of intent. That’s the thing I need you to sit with.”","imm":"Mike goes quiet for a second. “Fair,” he finally says. Not a full breakthrough — but something.","del":"Over the following weeks, Mike is visibly more careful — not perfect, but trying.","why":"Separating intent from impact gives Mike something concrete to work with, instead of something to defend. The cost is a longer, less comfortable conversation, extending something he seemed ready to close."},{"l":"Be blunt about the pattern, no cushioning","t":"“Mike, this keeps happening, and it needs to stop — no middle ground.”","imm":"Mike stiffens. “Okay... I hear you” — more defensive than reflective.","del":"The message lands, technically. But Mike is more guarded for a while, without necessarily understanding why.","why":"Bluntness removes any ambiguity about how serious this is. The cost is that, without empathy, it’s easy for Mike to hear this as an attack rather than information he can use."}]},{"title":"Reinforcing the Message","narrative":["You want to make sure the change sticks. Three ways to “lock in” the message — none of them is misconduct, but it’s worth noticing what each one actually teaches the team."],"choices":[{"l":"Summarize it in writing and CC Mike’s manager, “to be transparent”","t":"You send an email summarizing the conversation and copy Mike’s manager on it.","imm":"The email goes out. Mike replies politely, but visibly surprised at who was copied.","del":"Mike starts hesitating before agreeing to any informal conversation with you — he no longer knows what becomes a record.","why":"This looks like accountability, but escalating without telling Mike first turns a coaching moment into a surprise consequence — it breaks the trust that a private conversation would stay private, and teaches the team that talking to you privately isn’t actually private."},{"l":"Publicly praise Mike in the next meeting for “listening well”","t":"In the next meeting, you highlight publicly how Mike has “improved his listening.”","imm":"Mike looks a little embarrassed but accepts the praise. The team doesn’t quite follow the context.","del":"No one on the team saw Mike get this wrong in public — so the praise feels manufactured, and Mike himself isn’t sure how to read it next time.","why":"Public praise feels generous, but manufacturing a moment about a private correction — without warning Mike it’s coming — puts him on display for something the team never saw him get right in the first place, and teaches the room that feedback is theater, not honesty."},{"l":"Ask Alex, in front of Mike, to confirm things feel better now","t":"“Alex, do you feel things have improved with Mike?” you ask, with Mike present.","imm":"Alex hesitates, glances at Mike, and gives a vague, positive answer.","del":"Alex avoids bringing up anything related to Mike for the following weeks, even when asked privately.","why":"This puts the person with the least power in the room in the position of having to publicly vouch for their own senior colleague’s improvement, on the spot — even framed kindly, it turns Alex’s psychological safety into something they have to perform for an audience."}]},{"title":"Closing the Loop","narrative":["A month later. Mike hasn’t made a dismissive joke in weeks, and the interrupting has mostly stopped. Alex has started speaking up again, tentatively.","Real progress, not perfection — and it should show up in the team’s results too, not just its climate. What to do with that now is a genuinely disputed call among leaders."],"choices":[{"l":"Keep it informal — mention things as they come up","t":"You decide not to formalize anything, and keep an eye on it the way you have been.","imm":"Nothing changes day-to-day. Mike doesn’t feel like he’s “on a plan.”","del":"Progress mostly holds, though a few small moments slip past unaddressed when your own attention is elsewhere.","why":"Staying informal preserves the feel of genuine mentorship, matching Mike’s real, voluntary progress. The trade-off is that it depends entirely on your continued attention — nothing forces you to keep noticing if your own bandwidth shrinks."},{"l":"Put it in writing — a short development note with a follow-up date","t":"You draft a few lines summarizing the pattern, the progress, and a follow-up date, and share it with Mike directly.","imm":"Mike reads it carefully. “I get why you’re writing this down. I just didn’t expect it to be... official.”","del":"Expectations are now unambiguous for both of you — but the relationship shifts slightly, from mentorship toward something closer to process.","why":"Documentation creates a clear, fair record that protects both Mike and Alex if anything resurfaces later. The cost is that formalizing earlier than Mike feels is warranted can read as escalation, cooling a relationship that was actually moving in the right direction."},{"l":"Consider it resolved and move on","t":"Given the visible improvement, you decide not to raise it again unless something new comes up.","imm":"Nothing is said. Everyone moves on, including you.","del":"A few months later, a quieter version of the original pattern resurfaces — this time with a different junior teammate.","why":"Real progress deserves recognition, and constantly reopening a resolved issue has its own cost. The risk, given you’ve already seen this pattern quietly resurface once, is treating “better” as the same thing as “done.”"}]}],"profiles":{"champion":{"name":"Psychological Safety Champion","sum":"You consistently intervened with respect, courage, and specificity — even when it was uncomfortable. Your team is more likely to speak up, disagree, and take risks because of how you responded.","str":"Direct, specific feedback. Balances empathy with accountability. Follows through over time.","risk":"Watch for fatigue — consistently initiating hard conversations takes real energy."},"inconsistent":{"name":"Inclusive but Inconsistent","sum":"You care about inclusion, but your responses were uneven — sometimes courageous and specific, other times avoidant or vague. Your team likely experiences safety as situational.","str":"Genuine care for the team. Capable of strong intervention when you commit to it.","risk":"Inconsistency can be more confusing than a consistently lower bar."},"avoider":{"name":"Conflict Avoider","sum":"You tend to prioritize comfort over direct intervention. Issues you noticed often went unaddressed, or were addressed too gently.","str":"Warm, low-conflict presence.","risk":"Avoidance has a cost: without intervention, dominant voices quietly crowd out others."},"silencer":{"name":"Unintended Silencer","sum":"Despite good intentions, your choices — laughing along, staying silent, softening feedback — likely reinforced the very dynamics that discourage participation. One of the most common, least visible failures, coming from people who never meant harm.","str":"Not malicious, not aggressive — a genuinely fixable pattern once it’s visible.","risk":"Team members may quietly disengage rather than confront you, since nothing you did was overtly wrong."}},"plan":{"CONT":{"inclusion":"Making space for newer or quieter voices to finish their thought.","engage":"Bringing energy and trust into difficult conversations instead of letting them go flat.","develop":"Giving feedback that is specific and actionable, not just emotional.","results":"Connecting psychological safety to better, faster technical decisions.","accountability":"Naming specific behaviors directly with the person responsible.","grow":"Staying curious about your own blind spots."},"START":{"inclusion":"Actively inviting quieter team members back into the conversation.","engage":"Using tension as a chance to build trust, not just get through it.","develop":"Structuring feedback with situation, behavior, and impact.","results":"Measuring whether someone’s silence is costing the team quality or speed.","accountability":"Treating repeated patterns — not just single incidents — as worth naming directly.","grow":"Asking a trusted peer what you might be missing about your impact."},"COMMIT":{"inclusion":"In the next team meeting, I will notice who hasn’t spoken and invite them in by name.","engage":"In the next difficult conversation, I will name what the person does well before naming what needs to change.","develop":"This week, I will give one piece of feedback using situation, behavior, and impact.","results":"This week, I will ask the team whether a recent silence may have cost us a better decision.","accountability":"This week, I will name one pattern I’ve been letting slide, directly to the person involved.","grow":"This month, I will ask one person I trust what they think I miss about how I show up in meetings."},"DISC":{"inclusion":"What’s one concrete habit that would make it easier for a quieter voice to speak up this month?","engage":"When tension shows up, what could you do to keep it a dialogue instead of a lecture or a retreat?","develop":"What would it look like to give structured feedback every week, even for small moments?","results":"What decision on your team could have been better if someone had felt safe to disagree earlier?","accountability":"What pattern have you been letting slide because naming it felt awkward — and what would naming it look like?","grow":"Who could you ask, this month, what they think you miss about your own impact in the room?"}}},"es":{"ui":{"docTitle":"The Mike Case: simulación de liderazgo","brand":"Simulación de liderazgo","introTag":"Una simulación de liderazgo","introTitle":"The Mike Case","introLead":"Lideras un equipo de ocho personas. Mike es senior, gracioso y querido, y, sin proponérselo, hace más difícil que las voces más nuevas se escuchen. Lo que hagas al respecto define qué cree tu equipo que es seguro decir en voz alta.","fwNote":"Cada decisión se evalúa según el adidas Leadership Framework. La seguridad psicológica no es una habilidad aislada: es el resultado de practicar estos pilares de forma consistente. Como esto afecta directamente el desempeño del equipo, \u003cb>Deliver Results\u003c/b> también se evalúa aquí, junto con Empower y Elevate.","introFoot":"6 decisiones. La mayoría no tiene una opción claramente perfecta: líderes razonables elegirían distinto. Al final recibes un perfil y un pilar en el que enfocarte para la discusión grupal.","resultNote":"Este puntaje surge de tu desempeño en los seis pilares de abajo: la seguridad psicológica es el resultado de una conducta de liderazgo consistente, no una habilidad aislada.","planTitle":"Tu plan de acción de seguridad psicológica"},"excel":[{"w":"Conecta el trabajo del equipo con el propósito, los productos, los consumidores y la cultura de adidas, en las decisiones y no solo en las palabras.","a":"¿Siento más conexión con adidas por la forma en que mi líder se muestra?"},{"w":"Asume una responsabilidad real, equilibrando el impacto en el negocio, las personas y las consecuencias de largo plazo.","a":"¿Mi líder se hace cargo de las decisiones y los resultados incluso cuando es incómodo?"},{"w":"Mira hacia adelante, cuestiona la forma actual de trabajar y crea espacio para mejores soluciones.","a":"¿Mi líder nos ayuda a mirar hacia adelante, o mayormente reaccionamos a la demanda del día a día?"}],"scored":{"inclusion":"Crea un entorno donde las distintas perspectivas se valoran e incluyen de verdad.","engage":"Da una dirección clara y una energía que ayudan a las personas a hacer su mejor trabajo.","develop":"Apoya activamente el crecimiento con feedback, confianza y oportunidades.","results":"Ayuda a convertir los objetivos en resultados enfocándose en lo que realmente crea valor.","accountability":"Fija expectativas claras y aborda los problemas de forma constructiva.","grow":"Es ejemplo de aprendizaje y de apertura al feedback."},"phases":[{"title":"El comentario","narrative":["Tu equipo va por la mitad de la reunión semanal. Alex, que se sumó hace dos meses, propone un nuevo enfoque para el onboarding de clientes: algo verde todavía, pero prometedor.","Mike, un ingeniero senior, se ríe y se reclina en la silla: \u003cem>“En realidad eso ya lo probamos hace años”\u003c/em>, dice sonriendo. Algunos se ríen con él.","Todavía en tono amable, agrega: \u003cem>“Supongo que cada persona nueva tiene que redescubrir nuestros viejos errores.”\u003c/em> Alex también sonríe, pero la sonrisa no le llega a los ojos. No vuelve a hablar en el resto de la reunión.","Fue un comentario rápido, hasta un poco gracioso. Tienes unos dos segundos para decidir si vale la pena frenar la reunión por eso."],"choices":[{"l":"Reírte con los demás y seguir adelante","t":"Mike cae bien y, técnicamente, fue un chiste. Señalarlo podría convertirte en quien le corta la energía a la sala.","imm":"La reunión sigue sin sobresaltos. Mike se siente respaldado. Alex no dice nada más en el resto de la reunión.","del":"En las semanas siguientes, los aportes de Alex en las reuniones caen casi por completo, aunque es difícil afirmar con certeza que sea por esto.","why":"Esto mantiene la reunión liviana y no convierte un chiste menor en un tema mayor: un instinto defendible en el momento. El costo es que, en tiempo real, no puedes saber si fue algo inofensivo o la primera ficha del dominó."},{"l":"Nombrarlo con respeto, ahí mismo","t":"“Mike, sé que no fue con mala intención, pero asegurémonos de que las ideas nuevas tengan una escucha justa, más allá de lo que hayamos probado antes. Alex, ¿puedes contarnos qué sería distinto esta vez?”","imm":"La sala queda en silencio un segundo. Mike parece sorprendido, pero asiente: “Tienes razón.” Alex, con dudas, sigue explicando.","del":"En las semanas siguientes, otros se animan un poco más a hablar, aunque Mike también parece algo más reservado contigo.","why":"Nombrarlo en el momento protege a Alex y marca, en tiempo real, qué es aceptable. También implica corregir a un colega querido frente a todo el equipo por lo que, a primera vista, fue un comentario menor."},{"l":"Quedarte en silencio y hacer avanzar la discusión","t":"“Buen punto. Escuchemos también al resto del equipo.” Rediriges sin nombrar el comentario, con la idea de observar si se repite.","imm":"La reunión sigue sin fricción. Nadie parece notar que pasó algo.","del":"Alex habla un poco menos en las reuniones siguientes. No sabes si tiene relación.","why":"Mantener la reunión en movimiento evita convertir un comentario en una confrontación y te da margen para observar antes de reaccionar. El riesgo es que, desde el lugar de Alex, observar y no darse cuenta se ven exactamente igual."}]},{"title":"Mike interrumpe otra vez","narrative":["Dos semanas después. Alex le está explicando al equipo la solución a un bug recurrente. En mitad de la frase, Mike interviene: \u003cem>“En realidad, creo que el camino más rápido es parchearlo en la capa de la API.”\u003c/em>","Alex deja de hablar. Técnicamente Mike no se equivoca, incluso podría ser la mejor solución. Pero es la segunda vez este mes que interrumpe a Alex antes de que termine una idea. Nadie más parece notarlo.","Tienes unos tres segundos para decidir qué haces, si es que haces algo, frente a todo el equipo."],"choices":[{"l":"Señalarlo de inmediato, en la sala","t":"“Espera, Mike. Deja que Alex termine la idea primero.”","imm":"La sala queda en silencio. Alex termina, con algo de nervios. Mike levanta las manos: “Perdón, perdón, sigue.”","del":"Alex parece participar con más seguridad en las reuniones siguientes. Mike está notablemente más callado en lo que queda de esta.","why":"Corregirlo en vivo protege el momento para Alex y le muestra a todo el equipo qué se espera. También implica corregir a un colega senior y querido frente al grupo por una sugerencia técnica que ni siquiera era incorrecta."},{"l":"Dejarlo pasar y hablarlo con Mike en privado apenas termina","t":"La reunión continúa. Al terminar, buscas a Mike: “Interrumpiste a Alex dos veces este mes. Dale espacio para terminar.”","imm":"La reunión sigue fluida. En privado, Mike recibe el comentario sin mucha reacción: “Anotado, perdón por eso.”","del":"Alex nunca ve que la corrección ocurre. Desde su lugar, la reunión se sintió igual que las anteriores.","why":"Una conversación privada protege a Mike de la vergüenza pública y mantiene intacta la energía de la reunión. El costo es que Alex nunca ve la corrección, así que la lectura tácita de la sala sobre lo que es aceptable no cambia."},{"l":"Redirigir de forma neutral sin nombrar lo que pasó","t":"“Alex, continúa. Después volvemos al punto de Mike.”","imm":"La reunión sigue sin confrontación. Alex termina su idea.","del":"La semana siguiente vuelve a pasar algo parecido. Empieza a verse menos como un descuido y más como un hábito específico con Alex.","why":"Esto mantiene el ritmo y le da espacio a Alex para terminar sin confrontación. El riesgo es que trata la interrupción como algo incidental y no como un patrón que vale la pena nombrar, así que la norma en realidad no cambia."}]},{"title":"Escribir la evaluación","narrative":["Llega la temporada de evaluaciones de desempeño. Tienes que dejar este patrón por escrito como parte de la evaluación formal de Mike: algo que lo va a acompañar y que él va a leer.","Estás evaluando algunas formas de redactarlo. Ninguna se ve claramente mal en el papel, pero cada una tiene una trampa que no vas a ver del todo hasta después de escribirla."],"choices":[{"l":"Dejarlo en tus notas privadas de manager, sin decirle a Mike que existe","t":"Agregas una nota confidencial en tu propio archivo que marca el patrón como algo a monitorear, sin plantearlo directamente con Mike.","imm":"A Mike su evaluación le parece bien. No tiene idea de que se marcó algo.","del":"Si esto alguna vez pesa en una decisión de promoción o de bono, Mike no habrá tenido oportunidad de responder a algo que nunca supo que existía.","why":"Guardar una nota privada se siente prudente y evita una conversación incómoda antes de sentirte en condiciones de tenerla. Pero documentar algo que puede afectar la carrera de Mike sin decírselo nunca rompe la justicia básica del feedback: no puede mejorar ni cuestionar algo que nunca le dijeron que existe."},{"l":"Plantearlo como un rasgo general: “necesita desarrollar más paciencia con el talento junior”","t":"Escribes la nota en términos generales, sin vincularla a los comentarios o momentos específicos que viste.","imm":"Mike la lee y no tiene claro qué cambiar en concreto. “Supongo que voy a intentar ser más paciente.”","del":"Sin detalles concretos, es probable que el mismo patrón se repita y que la evaluación del año que viene diga algo parecido, igual de vago.","why":"Una nota sobre un rasgo general evita reabrir momentos específicos, posiblemente discutibles, y resulta menos confrontativa de escribir. Pero convertir una conducta en una etiqueta de personalidad no le da a Mike nada concreto sobre lo cual actuar, y el feedback a nivel de carácter es justamente donde la gente se pone a la defensiva en lugar de reflexionar."},{"l":"Incluir como evidencia un detalle de la conversación privada de Alex contigo, sin dar su nombre","t":"Agregas una línea que menciona que “una persona del equipo compartió en privado que se siente silenciada en las reuniones”, lo bastante específica como para que Mike probablemente adivine quién fue.","imm":"Mike la lee y, en menos de un día, le pregunta directamente a Alex: “Oye, ¿le dijiste algo de mí a nuestro manager?”","del":"Para Alex es una sorpresa desagradable que una conversación privada se haya convertido en evidencia identificable, y ahora desconfía más de volver a contarte algo.","why":"Basar el feedback en un momento real y específico es justo lo que lo hace creíble y accionable. El costo aquí es hacerlo de una forma rastreable hasta Alex sin su consentimiento: convierte la confianza que alguien depositó en ti en evidencia que no aceptó aportar, y le enseña a tu equipo que contarte algo no es realmente seguro."}]},{"title":"La conversación difícil","narrative":["Le pides quince minutos a Mike. Antes de que puedas abrir la conversación, dice, con una risa relajada: \u003cem>“Si esto es por aquel chiste, creo que la gente se está volviendo un poco demasiado sensible últimamente.”\u003c/em>","Después de que planteas tu punto, agrega: \u003cem>“Entendido. La próxima vez voy a tratar de sonar menos experimentado”\u003c/em>, con una sonrisa irónica, \u003cem>“pero no estaba tratando de desanimar a nadie.”\u003c/em>","Todavía no terminó de atar los cabos. Ya dijiste lo tuyo una vez. Cuánto más vale la pena decir ahora es una decisión realmente difícil."],"choices":[{"l":"Mantener el tono cálido, mencionarlo a la ligera y cerrar","t":"“Solo es algo para pensar”, dices, y terminas la conversación ahí.","imm":"La conversación termina en buen tono. Mike se va con la sensación de haber sido escuchado y no sermoneado.","del":"Sin refuerzo, lo que Mike se lleva termina siendo algo más parecido a “ser un poco más amable” que un patrón específico a cambiar.","why":"Terminar aquí respeta que ya diste un feedback claro: repetirlo puede sugerir que no confías en que lo haya entendido. El riesgo es que su último comentario sugiere que no terminó de atar los cabos, y estás eligiendo no comprobarlo."},{"l":"Ir a lo específico (situación, conducta, impacto) y sostener la postura incluso después de su primera respuesta","t":"“Entiendo que no estabas tratando de desanimar a nadie, y te creo. Aun así, el impacto existió, más allá de la intención. Eso es lo que necesito que pienses.”","imm":"Mike se queda callado un segundo. “Es justo”, dice al fin. No es un cambio total, pero es algo.","del":"En las semanas siguientes, Mike es visiblemente más cuidadoso: no es perfecto, pero lo intenta.","why":"Separar la intención del impacto le da a Mike algo concreto con lo que trabajar, en lugar de algo de lo que defenderse. El costo es una conversación más larga y menos cómoda, que extiende algo que él parecía querer cerrar."},{"l":"Hablar del patrón sin rodeos, sin suavizarlo","t":"“Mike, esto sigue pasando y tiene que parar. No hay punto medio.”","imm":"Mike se tensa. “Está bien... te escucho”, más a la defensiva que reflexivo.","del":"El mensaje llega, técnicamente. Pero Mike está más a la defensiva por un tiempo, sin necesariamente entender por qué.","why":"La franqueza elimina cualquier ambigüedad sobre la seriedad del tema. El costo es que, sin empatía, es fácil que Mike lo escuche como un ataque y no como información que puede usar."}]},{"title":"Reforzar el mensaje","narrative":["Quieres asegurarte de que el cambio se sostenga. Hay tres formas de “fijar” el mensaje. Ninguna es una falta, pero vale la pena notar qué le enseña realmente cada una al equipo."],"choices":[{"l":"Resumirlo por escrito y copiar al manager de Mike, “para ser transparente”","t":"Envías un correo con el resumen de la conversación y pones en copia al manager de Mike.","imm":"El correo sale. Mike responde con cortesía, pero visiblemente sorprendido por quién estaba en copia.","del":"Mike empieza a dudar antes de aceptar cualquier conversación informal contigo: ya no sabe qué termina quedando registrado.","why":"Esto parece accountability, pero escalar sin avisarle antes a Mike convierte un momento de coaching en una consecuencia sorpresa: rompe la confianza en que una conversación privada seguiría siendo privada y le enseña al equipo que hablar contigo en privado no es realmente privado."},{"l":"Elogiar públicamente a Mike en la próxima reunión por “escuchar bien”","t":"En la reunión siguiente, destacas en público cómo Mike “mejoró su escucha”.","imm":"Mike se ve un poco incómodo, pero acepta el elogio. El equipo no termina de entender el contexto.","del":"Nadie en el equipo vio a Mike equivocarse en esto en público, así que el elogio se siente fabricado, y el propio Mike no sabe bien cómo interpretarlo la próxima vez.","why":"El elogio público se siente generoso, pero fabricar un momento a partir de una corrección privada, sin avisarle a Mike, lo expone por algo que el equipo nunca lo vio hacer bien, y le enseña a la sala que el feedback es teatro y no honestidad."},{"l":"Pedirle a Alex, delante de Mike, que confirme que ahora las cosas están mejor","t":"“Alex, ¿sientes que las cosas mejoraron con Mike?”, preguntas, con Mike presente.","imm":"Alex duda, mira a Mike y da una respuesta vaga y positiva.","del":"Alex evita mencionar cualquier tema relacionado con Mike durante las semanas siguientes, incluso cuando se lo preguntan en privado.","why":"Esto pone a la persona con menos poder de la sala en la posición de tener que avalar públicamente, en el momento, la mejora de su colega senior. Aunque se plantee con amabilidad, convierte la seguridad psicológica de Alex en algo que tiene que actuar frente a un público."}]},{"title":"Cerrar el ciclo","narrative":["Un mes después. Mike lleva semanas sin hacer un chiste despectivo y las interrupciones casi desaparecieron. Alex volvió a participar, con cautela.","Es un avance real, no la perfección, y debería verse también en los resultados del equipo, no solo en el clima. Qué hacer ahora con eso es una decisión sobre la que los líderes de verdad no se ponen de acuerdo."],"choices":[{"l":"Mantenerlo informal: mencionar las cosas a medida que surgen","t":"Decides no formalizar nada y seguir prestando atención como hasta ahora.","imm":"Nada cambia en el día a día. Mike no siente que está “en un plan”.","del":"El avance se sostiene en general, aunque algunos momentos menores pasan sin abordarse cuando tu atención está en otra parte.","why":"Mantenerlo informal conserva el espíritu de una mentoría genuina, acorde con el avance real y voluntario de Mike. La contracara es que depende por completo de tu atención sostenida: nada te obliga a seguir notándolo si tu disponibilidad se reduce."},{"l":"Ponerlo por escrito: una nota breve de desarrollo con fecha de seguimiento","t":"Redactas unas líneas que resumen el patrón, el avance y una fecha de seguimiento, y las compartes directamente con Mike.","imm":"Mike la lee con atención. “Entiendo por qué lo escribes. Solo que no esperaba que fuera... oficial.”","del":"Las expectativas ahora son inequívocas para ambos, pero la relación cambia un poco: de la mentoría hacia algo más parecido a un proceso.","why":"La documentación crea un registro claro y justo que protege tanto a Mike como a Alex si algo reaparece más adelante. El costo es que formalizar antes de lo que Mike considera justificado puede leerse como una escalada y enfriar una relación que iba en la dirección correcta."},{"l":"Darlo por resuelto y seguir adelante","t":"Dada la mejora visible, decides no volver a plantearlo salvo que surja algo nuevo.","imm":"No se dice nada. Todos siguen adelante, tú también.","del":"Unos meses después, reaparece una versión más silenciosa del patrón original, esta vez con otra persona junior del equipo.","why":"El avance real merece reconocimiento, y reabrir constantemente un tema resuelto tiene su propio costo. El riesgo, dado que ya viste este patrón reaparecer en silencio una vez, es tratar “mejor” como si fuera lo mismo que “terminado”."}]}],"profiles":{"champion":{"name":"Referente de seguridad psicológica","sum":"Interviniste de forma consistente con respeto, coraje y especificidad, incluso cuando era incómodo. Es más probable que tu equipo hable, discrepe y tome riesgos gracias a cómo respondiste.","str":"Feedback directo y específico. Equilibra empatía con accountability. Da seguimiento en el tiempo.","risk":"Cuidado con el desgaste: iniciar conversaciones difíciles de forma constante consume energía real."},"inconsistent":{"name":"Inclusión con inconsistencias","sum":"Te importa la inclusión, pero tus respuestas fueron desparejas: a veces valientes y específicas, otras evasivas o vagas. Es probable que tu equipo viva la seguridad como algo que depende de la situación.","str":"Interés genuino por el equipo. Capacidad de intervenir con fuerza cuando te comprometes.","risk":"La inconsistencia puede confundir más que una vara consistentemente más baja."},"avoider":{"name":"Tendencia a evitar el conflicto","sum":"Tiendes a priorizar la comodidad por sobre la intervención directa. Los temas que notaste muchas veces quedaron sin abordar, o se abordaron con demasiada suavidad.","str":"Presencia cálida y de bajo conflicto.","risk":"Evitar tiene un costo: sin intervención, las voces dominantes desplazan en silencio a las demás."},"silencer":{"name":"Silenciamiento involuntario","sum":"A pesar de las buenas intenciones, tus decisiones (reírte con los demás, quedarte en silencio, suavizar el feedback) probablemente reforzaron las mismas dinámicas que desalientan la participación. Es una de las fallas más comunes y menos visibles, y viene de personas que nunca quisieron hacer daño.","str":"Sin malicia ni agresividad: un patrón que realmente se puede corregir una vez que se hace visible.","risk":"Las personas del equipo pueden desconectarse en silencio en lugar de confrontarte, porque nada de lo que hiciste estuvo abiertamente mal."}},"plan":{"CONT":{"inclusion":"Dar espacio para que las voces más nuevas o más calladas terminen su idea.","engage":"Llevar energía y confianza a las conversaciones difíciles en lugar de dejar que se apaguen.","develop":"Dar feedback específico y accionable, no solo emocional.","results":"Conectar la seguridad psicológica con decisiones técnicas mejores y más rápidas.","accountability":"Nombrar conductas específicas directamente con la persona responsable.","grow":"Mantener la curiosidad sobre tus propios puntos ciegos."},"START":{"inclusion":"Invitar activamente a las personas más calladas del equipo a volver a la conversación.","engage":"Usar la tensión como una oportunidad para construir confianza, no solo para atravesarla.","develop":"Estructurar el feedback con situación, conducta e impacto.","results":"Medir si el silencio de alguien le está costando calidad o velocidad al equipo.","accountability":"Tratar los patrones repetidos, y no solo los incidentes aislados, como algo que vale la pena nombrar de forma directa.","grow":"Preguntarle a un par de confianza qué podrías estar pasando por alto sobre tu impacto."},"COMMIT":{"inclusion":"En la próxima reunión de equipo, voy a notar quién no habló y voy a invitar a esa persona por su nombre.","engage":"En la próxima conversación difícil, voy a nombrar lo que la persona hace bien antes de nombrar lo que tiene que cambiar.","develop":"Esta semana, voy a dar un feedback usando situación, conducta e impacto.","results":"Esta semana, voy a preguntarle al equipo si algún silencio reciente pudo habernos costado una mejor decisión.","accountability":"Esta semana, voy a nombrar un patrón que vengo dejando pasar, directamente con la persona involucrada.","grow":"Este mes, voy a preguntarle a una persona de confianza qué cree que se me escapa sobre cómo me muestro en las reuniones."},"DISC":{"inclusion":"¿Qué hábito concreto haría más fácil que una voz más callada se anime a hablar este mes?","engage":"Cuando aparece la tensión, ¿qué podrías hacer para que siga siendo un diálogo y no un sermón o una retirada?","develop":"¿Cómo sería dar feedback estructurado todas las semanas, incluso por momentos menores?","results":"¿Qué decisión de tu equipo podría haber sido mejor si alguien se hubiera sentido con seguridad para discrepar antes?","accountability":"¿Qué patrón vienes dejando pasar porque nombrarlo resultaba incómodo, y cómo sería nombrarlo?","grow":"¿A quién podrías preguntarle, este mes, qué cree que se te escapa sobre tu propio impacto en la sala?"}}},"pt":{"ui":{"docTitle":"The Mike Case: simulação de liderança","brand":"Simulação de liderança","introTag":"Uma simulação de liderança","introTitle":"The Mike Case","introLead":"Você lidera uma equipe de oito pessoas. Mike é sênior, engraçado e querido, e, sem querer, torna mais difícil que as vozes mais novas sejam ouvidas. O que você faz a respeito define o que a sua equipe acredita ser seguro dizer em voz alta.","fwNote":"Cada decisão é avaliada com base no adidas Leadership Framework. Segurança psicológica não é uma habilidade isolada: é o resultado desses pilares praticados com consistência. Como isso afeta diretamente o desempenho da equipe, \u003cb>Deliver Results\u003c/b> também é avaliado aqui, junto com Empower e Elevate.","introFoot":"6 decisões. A maioria não tem uma opção claramente perfeita: líderes razoáveis escolheriam de formas diferentes. No final, você recebe um perfil e um pilar para focar na discussão em grupo.","resultNote":"Esta pontuação vem do seu desempenho nos seis pilares abaixo: a segurança psicológica é o resultado de um comportamento de liderança consistente, não uma habilidade isolada.","planTitle":"Seu plano de ação de segurança psicológica"},"excel":[{"w":"Conecta o trabalho da equipe ao propósito, aos produtos, aos consumidores e à cultura da adidas, nas decisões e não só nas palavras.","a":"Eu sinto mais conexão com a adidas por causa da forma como a minha liderança se apresenta?"},{"w":"Assume responsabilidade de verdade, equilibrando o impacto no negócio, nas pessoas e as consequências de longo prazo.","a":"A minha liderança assume a responsabilidade pelas decisões e pelos resultados mesmo quando é desconfortável?"},{"w":"Olha para a frente, questiona a forma atual de trabalhar e cria espaço para soluções melhores.","a":"A minha liderança nos ajuda a olhar para a frente, ou estamos na maior parte do tempo reagindo à demanda do dia a dia?"}],"scored":{"inclusion":"Cria um ambiente em que diferentes perspectivas são genuinamente valorizadas e incluídas.","engage":"Dá uma direção clara e uma energia que ajudam as pessoas a fazer o seu melhor trabalho.","develop":"Apoia ativamente o crescimento por meio de feedback, confiança e oportunidades.","results":"Ajuda a transformar metas em resultados, com foco no que realmente gera valor.","accountability":"Define expectativas claras e trata os problemas de forma construtiva.","grow":"É exemplo de aprendizado e de abertura ao feedback."},"phases":[{"title":"O comentário","narrative":["Sua equipe está na metade da reunião semanal. Alex, que entrou há dois meses, propõe uma nova abordagem para o onboarding de clientes: ainda um pouco crua, mas promissora.","Mike, um engenheiro sênior, dá uma risada e se recosta na cadeira: \u003cem>“Na verdade, a gente já tentou isso anos atrás”\u003c/em>, diz, sorrindo. Algumas pessoas riem junto.","Ainda em tom amigável, ele acrescenta: \u003cem>“Acho que toda pessoa nova precisa redescobrir os nossos velhos erros.”\u003c/em> Alex também sorri, mas o sorriso não chega aos olhos. Não fala mais nada até o fim da reunião.","Foi um comentário rápido, até um pouco engraçado. Você tem uns dois segundos para decidir se vale a pena interromper a reunião por isso."],"choices":[{"l":"Rir junto e seguir em frente","t":"Mike é querido e, tecnicamente, foi uma piada. Apontar isso pode fazer de você a pessoa que derruba a energia da sala.","imm":"A reunião segue tranquila. Mike se sente validado. Alex não diz mais nada até o fim da reunião.","del":"Nas semanas seguintes, as contribuições de Alex nas reuniões caem quase por completo, embora seja difícil afirmar com certeza que o motivo é esse.","why":"Isso mantém a reunião leve e não transforma uma piada pequena em algo maior: um instinto defensável no momento. O custo é que, em tempo real, você não tem como saber se foi algo inofensivo ou a primeira peça do dominó."},{"l":"Nomear com respeito, ali mesmo","t":"“Mike, sei que não foi por mal, mas vamos garantir que ideias novas sejam ouvidas de forma justa, independentemente do que já tentamos antes. Alex, pode contar mais sobre o que seria diferente desta vez?”","imm":"A sala fica em silêncio por um segundo. Mike parece surpreso, mas concorda: “Justo.” Alex, com hesitação, continua explicando.","del":"Nas semanas seguintes, outras pessoas ficam um pouco mais dispostas a falar, embora Mike também pareça um pouco mais reservado com você.","why":"Nomear na hora protege Alex e sinaliza, em tempo real, o que é aceitável. Também significa corrigir um colega querido na frente de toda a equipe por algo que, à primeira vista, foi um comentário pequeno."},{"l":"Ficar em silêncio e fazer a discussão avançar","t":"“Bom ponto. Vamos ouvir também o restante da equipe.” Você redireciona sem nomear o comentário, planejando observar se vira um padrão.","imm":"A reunião segue sem atrito. Ninguém parece notar que algo aconteceu.","del":"Alex fala um pouco menos nas reuniões seguintes. Você não sabe se tem relação.","why":"Manter a reunião andando evita transformar um comentário em confronto e dá a você espaço para observar antes de reagir. O risco é que, do ponto de vista de Alex, observar e não perceber parecem exatamente a mesma coisa."}]},{"title":"Mike interrompe de novo","narrative":["Duas semanas depois. Alex está explicando à equipe a correção de um bug recorrente. No meio da frase, Mike entra: \u003cem>“Na verdade, acho que o caminho mais rápido é só aplicar um patch na camada da API.”\u003c/em>","Alex para de falar. Tecnicamente, Mike não está errado, pode até ser a melhor correção. Mas é a segunda vez neste mês que ele corta Alex antes do fim de um raciocínio. Ninguém mais parece notar.","Você tem uns três segundos para decidir o que faz, se é que faz alguma coisa, na frente de toda a equipe."],"choices":[{"l":"Apontar na hora, na sala","t":"“Espera, Mike. Deixa Alex terminar o raciocínio primeiro.”","imm":"A sala fica em silêncio. Alex termina, com um pouco de nervosismo. Mike levanta as mãos: “Desculpa, desculpa, pode continuar.”","del":"Alex parece participar com mais segurança nas reuniões seguintes. Mike fica visivelmente mais calado no restante desta.","why":"Corrigir ao vivo protege o momento para Alex e mostra a toda a equipe o que se espera. Também significa corrigir um colega sênior e querido na frente do grupo por uma sugestão técnica que nem estava errada."},{"l":"Deixar passar e falar com Mike em particular logo depois","t":"A reunião continua. Depois, você procura Mike: “Você cortou Alex duas vezes neste mês. Deixe espaço para a conclusão do raciocínio.”","imm":"A reunião segue fluida. Em particular, Mike recebe o recado sem muita reação: “Anotado, desculpa por isso.”","del":"Alex nunca vê a correção acontecer. Do ponto de vista de Alex, a reunião foi igual às anteriores.","why":"Uma conversa em particular protege Mike do constrangimento público e mantém a energia da reunião. O custo é que Alex nunca vê a correção acontecer, então a leitura implícita da sala sobre o que é aceitável não muda."},{"l":"Redirecionar de forma neutra, sem nomear o que aconteceu","t":"“Alex, continue. Depois voltamos ao ponto do Mike.”","imm":"A reunião segue sem confronto. Alex conclui o raciocínio.","del":"Algo parecido acontece de novo na semana seguinte. Começa a parecer menos um deslize e mais um hábito específico com Alex.","why":"Isso mantém o ritmo e dá espaço para Alex terminar sem confronto. O risco é tratar a interrupção como algo pontual, e não como um padrão que vale a pena nomear, então a norma em si não muda."}]},{"title":"Escrevendo a avaliação","narrative":["Chega a época das avaliações de desempenho. Você precisa registrar esse padrão por escrito como parte da avaliação formal de Mike: algo que vai acompanhá-lo e que ele vai ler.","Você está avaliando algumas formas de redigir isso. Nenhuma parece claramente errada no papel, mas cada uma tem uma armadilha que você só vai enxergar por completo depois de escrever."],"choices":[{"l":"Manter nas suas anotações privadas de gestão, sem contar a Mike que isso existe","t":"Você adiciona uma nota confidencial ao seu próprio arquivo, sinalizando o padrão como algo a monitorar, sem levar o assunto diretamente a Mike.","imm":"Para Mike, a avaliação parece tranquila. Ele não faz ideia de que algo foi sinalizado.","del":"Se isso algum dia pesar em uma decisão de promoção ou bônus, Mike não terá tido chance de responder a algo que nunca soube que existia.","why":"Manter uma nota privada parece cauteloso e evita uma conversa desconfortável antes de você se sentir em condições de tê-la. Mas documentar algo que pode afetar a carreira de Mike sem nunca contar a ele quebra a justiça básica do feedback: ele não pode melhorar nem contestar algo que nunca lhe disseram que existe."},{"l":"Enquadrar como um traço geral: “precisa desenvolver mais paciência com talentos juniores”","t":"Você escreve a nota em termos gerais, sem ligá-la aos comentários ou momentos específicos que presenciou.","imm":"Mike lê e não tem certeza do que, especificamente, deve mudar. “Acho que vou tentar ser mais paciente.”","del":"Sem detalhes concretos, o mesmo padrão provavelmente vai se repetir, e a avaliação do ano que vem pode dizer algo parecido, com a mesma vagueza.","why":"Uma nota sobre um traço geral evita reabrir momentos específicos, possivelmente contestáveis, e é menos confrontadora de escrever. Mas transformar um comportamento em rótulo de personalidade não dá a Mike nada concreto sobre o que agir, e o feedback sobre caráter é justamente onde as pessoas ficam na defensiva em vez de refletir."},{"l":"Incluir como evidência um detalhe da conversa privada de Alex com você, sem citar o nome","t":"Você acrescenta uma linha dizendo que “uma pessoa da equipe compartilhou em particular que se sente silenciada nas reuniões”, específica o bastante para Mike provavelmente adivinhar quem foi.","imm":"Mike lê e, em menos de um dia, pergunta diretamente a Alex: “Ei, você falou alguma coisa sobre mim para a nossa liderança?”","del":"Para Alex, é uma surpresa desagradável que uma conversa privada tenha virado evidência identificável, e agora há mais receio de voltar a confiar algo a você.","why":"Basear o feedback em um momento real e específico é exatamente o que o torna crível e acionável. O custo aqui é fazer isso de um jeito rastreável até Alex, sem consentimento: transforma a confiança que alguém depositou em você em evidência que a pessoa não concordou em fornecer, e ensina à sua equipe que confiar algo a você não é realmente seguro."}]},{"title":"A conversa difícil","narrative":["Você pede quinze minutos a Mike. Antes que você consiga abrir a conversa, ele diz, com uma risada tranquila: \u003cem>“Se é sobre aquela piada, acho que as pessoas estão ficando um pouco sensíveis demais ultimamente.”\u003c/em>","Depois que você expõe o seu ponto, ele acrescenta: \u003cem>“Entendido. Da próxima vez vou tentar soar menos experiente”\u003c/em>, com um sorriso irônico, \u003cem>“mas eu não estava tentando desanimar ninguém.”\u003c/em>","Ele ainda não ligou todos os pontos. Você já disse o que tinha a dizer uma vez. O quanto mais vale a pena dizer agora é uma decisão realmente difícil."],"choices":[{"l":"Manter o tom leve, mencionar de passagem e encerrar","t":"“É só algo para pensar”, você diz, e encerra a conversa ali.","imm":"A conversa termina em clima tranquilo. Mike sai com a sensação de ter sido ouvido, e não de ter levado um sermão.","del":"Sem reforço, o que fica para Mike é algo mais próximo de “ser um pouco mais gentil” do que um padrão específico a mudar.","why":"Encerrar aqui respeita o fato de que você já deu um feedback claro: repetir pode sugerir que você não confia que ele entendeu. O risco é que o último comentário dele indica que ele ainda não ligou os pontos, e você está escolhendo não verificar."},{"l":"Ir ao específico (situação, comportamento, impacto) e manter a posição mesmo depois da primeira resposta dele","t":"“Eu entendo que você não estava tentando desanimar ninguém, e acredito nisso. Ainda assim, o impacto aconteceu, independentemente da intenção. É sobre isso que preciso que você reflita.”","imm":"Mike fica em silêncio por um segundo. “Justo”, diz por fim. Não é uma virada completa, mas é alguma coisa.","del":"Nas semanas seguintes, Mike fica visivelmente mais cuidadoso: não é perfeito, mas está tentando.","why":"Separar intenção de impacto dá a Mike algo concreto com que trabalhar, em vez de algo do que se defender. O custo é uma conversa mais longa e menos confortável, que prolonga algo que ele parecia pronto para encerrar."},{"l":"Falar do padrão sem rodeios, sem amortecer","t":"“Mike, isso continua acontecendo e precisa parar. Não tem meio-termo.”","imm":"Mike fica tenso. “Tá bom... entendi”, mais na defensiva do que reflexivo.","del":"A mensagem chega, tecnicamente. Mas Mike fica mais na defensiva por um tempo, sem necessariamente entender por quê.","why":"A franqueza elimina qualquer ambiguidade sobre a seriedade do assunto. O custo é que, sem empatia, é fácil para Mike ouvir isso como um ataque, e não como uma informação que ele pode usar."}]},{"title":"Reforçando a mensagem","narrative":["Você quer garantir que a mudança se mantenha. Há três formas de “fixar” a mensagem. Nenhuma é uma falta de conduta, mas vale notar o que cada uma realmente ensina à equipe."],"choices":[{"l":"Resumir por escrito e copiar a liderança de Mike, “para ser transparente”","t":"Você envia um e-mail resumindo a conversa e coloca em cópia quem lidera Mike.","imm":"O e-mail é enviado. Mike responde com educação, mas visivelmente surpreso com quem estava em cópia.","del":"Mike passa a hesitar antes de aceitar qualquer conversa informal com você: ele já não sabe o que vira registro.","why":"Isso parece accountability, mas escalar sem avisar Mike antes transforma um momento de coaching em uma consequência surpresa: quebra a confiança de que uma conversa privada continuaria privada e ensina à equipe que falar com você em particular não é realmente particular."},{"l":"Elogiar Mike publicamente na próxima reunião por “ouvir bem”","t":"Na reunião seguinte, você destaca em público como Mike “melhorou a escuta”.","imm":"Mike parece um pouco constrangido, mas aceita o elogio. A equipe não entende bem o contexto.","del":"Ninguém na equipe viu Mike errar nisso em público, então o elogio soa fabricado, e o próprio Mike não sabe bem como interpretá-lo da próxima vez.","why":"O elogio público parece generoso, mas fabricar um momento a partir de uma correção privada, sem avisar Mike, o expõe por algo que a equipe nunca o viu acertar, e ensina à sala que feedback é teatro, não honestidade."},{"l":"Pedir a Alex, na frente de Mike, que confirme que as coisas estão melhores agora","t":"“Alex, você sente que as coisas melhoraram com o Mike?”, você pergunta, com Mike presente.","imm":"Alex hesita, olha para Mike e dá uma resposta vaga e positiva.","del":"Alex evita tocar em qualquer assunto relacionado a Mike nas semanas seguintes, mesmo quando a pergunta é feita em particular.","why":"Isso coloca a pessoa com menos poder na sala na posição de ter que atestar publicamente, na hora, a melhora de um colega sênior. Mesmo com um tom gentil, transforma a segurança psicológica de Alex em algo que precisa ser encenado diante de uma plateia."}]},{"title":"Fechando o ciclo","narrative":["Um mês depois. Mike não faz uma piada depreciativa há semanas, e as interrupções praticamente pararam. Alex voltou a falar, com cautela.","É um progresso real, não a perfeição, e deveria aparecer também nos resultados da equipe, não só no clima. O que fazer com isso agora é uma decisão sobre a qual líderes de fato discordam."],"choices":[{"l":"Manter informal: mencionar as coisas à medida que surgirem","t":"Você decide não formalizar nada e continuar prestando atenção como vem fazendo.","imm":"Nada muda no dia a dia. Mike não sente que está “em um plano”.","del":"O progresso se mantém em geral, embora alguns momentos pequenos passem sem ser tratados quando a sua atenção está em outro lugar.","why":"Manter a informalidade preserva o espírito de uma mentoria genuína, coerente com o progresso real e voluntário de Mike. A contrapartida é que isso depende inteiramente da sua atenção contínua: nada obriga você a continuar percebendo se a sua disponibilidade diminuir."},{"l":"Colocar por escrito: uma nota curta de desenvolvimento com data de acompanhamento","t":"Você redige algumas linhas resumindo o padrão, o progresso e uma data de acompanhamento, e compartilha diretamente com Mike.","imm":"Mike lê com atenção. “Entendo por que você está registrando isso. Só não esperava que fosse... oficial.”","del":"As expectativas agora são inequívocas para os dois, mas a relação muda um pouco: da mentoria para algo mais próximo de um processo.","why":"A documentação cria um registro claro e justo, que protege tanto Mike quanto Alex se algo voltar a aparecer. O custo é que formalizar antes do que Mike considera justificado pode ser lido como uma escalada e esfriar uma relação que estava indo na direção certa."},{"l":"Considerar resolvido e seguir em frente","t":"Diante da melhora visível, você decide não voltar ao assunto, a menos que surja algo novo.","imm":"Nada é dito. Todo mundo segue em frente, inclusive você.","del":"Alguns meses depois, uma versão mais discreta do padrão original reaparece, desta vez com outra pessoa júnior da equipe.","why":"Progresso real merece reconhecimento, e reabrir o tempo todo um assunto resolvido tem o seu próprio custo. O risco, já que você viu esse padrão reaparecer discretamente uma vez, é tratar “melhor” como se fosse o mesmo que “resolvido”."}]}],"profiles":{"champion":{"name":"Referência em segurança psicológica","sum":"Você interveio de forma consistente, com respeito, coragem e especificidade, mesmo quando era desconfortável. É mais provável que a sua equipe fale, discorde e assuma riscos por causa da forma como você respondeu.","str":"Feedback direto e específico. Equilibra empatia com accountability. Dá continuidade ao longo do tempo.","risk":"Atenção ao desgaste: iniciar conversas difíceis de forma constante consome energia de verdade."},"inconsistent":{"name":"Inclusão com inconsistências","sum":"Você se importa com inclusão, mas as suas respostas foram desiguais: às vezes corajosas e específicas, outras vezes evasivas ou vagas. É provável que a sua equipe viva a segurança como algo que depende da situação.","str":"Cuidado genuíno com a equipe. Capacidade de intervir com força quando você se compromete.","risk":"A inconsistência pode confundir mais do que um padrão consistentemente mais baixo."},"avoider":{"name":"Tendência a evitar conflitos","sum":"Você tende a priorizar o conforto em vez da intervenção direta. Questões que você percebeu muitas vezes ficaram sem tratamento, ou foram tratadas com suavidade demais.","str":"Presença acolhedora e de baixo conflito.","risk":"Evitar tem um custo: sem intervenção, as vozes dominantes vão abafando as outras em silêncio."},"silencer":{"name":"Silenciamento não intencional","sum":"Apesar das boas intenções, as suas escolhas (rir junto, ficar em silêncio, suavizar o feedback) provavelmente reforçaram as mesmas dinâmicas que desestimulam a participação. É uma das falhas mais comuns e menos visíveis, e vem de pessoas que nunca quiseram causar dano.","str":"Sem malícia nem agressividade: um padrão realmente corrigível quando se torna visível.","risk":"As pessoas da equipe podem se desengajar em silêncio em vez de confrontar você, já que nada do que você fez foi abertamente errado."}},"plan":{"CONT":{"inclusion":"Abrir espaço para que as vozes mais novas ou mais quietas concluam o raciocínio.","engage":"Levar energia e confiança para as conversas difíceis, em vez de deixá-las esfriar.","develop":"Dar feedback específico e acionável, não apenas emocional.","results":"Conectar a segurança psicológica a decisões técnicas melhores e mais rápidas.","accountability":"Nomear comportamentos específicos diretamente com a pessoa responsável.","grow":"Manter a curiosidade sobre os seus próprios pontos cegos."},"START":{"inclusion":"Convidar ativamente as pessoas mais quietas da equipe a voltar para a conversa.","engage":"Usar a tensão como oportunidade para construir confiança, e não só para atravessá-la.","develop":"Estruturar o feedback com situação, comportamento e impacto.","results":"Medir se o silêncio de alguém está custando qualidade ou velocidade à equipe.","accountability":"Tratar padrões repetidos, e não apenas incidentes isolados, como algo que vale a pena nomear diretamente.","grow":"Perguntar a um par de confiança o que você pode estar deixando de ver sobre o seu impacto."},"COMMIT":{"inclusion":"Na próxima reunião de equipe, vou notar quem não falou e convidar essa pessoa pelo nome.","engage":"Na próxima conversa difícil, vou nomear o que a pessoa faz bem antes de nomear o que precisa mudar.","develop":"Nesta semana, vou dar um feedback usando situação, comportamento e impacto.","results":"Nesta semana, vou perguntar à equipe se algum silêncio recente pode ter nos custado uma decisão melhor.","accountability":"Nesta semana, vou nomear um padrão que venho deixando passar, diretamente com a pessoa envolvida.","grow":"Neste mês, vou perguntar a uma pessoa de confiança o que ela acha que eu não percebo sobre como me apresento nas reuniões."},"DISC":{"inclusion":"Que hábito concreto tornaria mais fácil para uma voz mais quieta se manifestar neste mês?","engage":"Quando a tensão aparece, o que você poderia fazer para que continue sendo um diálogo, e não um sermão ou um recuo?","develop":"Como seria dar feedback estruturado toda semana, mesmo em momentos pequenos?","results":"Que decisão da sua equipe poderia ter sido melhor se alguém tivesse se sentido em segurança para discordar antes?","accountability":"Que padrão você vem deixando passar porque nomeá-lo parecia constrangedor, e como seria nomeá-lo?","grow":"A quem você poderia perguntar, neste mês, o que essa pessoa acha que você não percebe sobre o seu próprio impacto na sala?"}}}}};
